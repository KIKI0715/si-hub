<style>
html,body{margin:0;background:#FAF8F2}
.wr{position:relative;width:100%}
.wr iframe{position:sticky;top:0;display:block;border:0;background:transparent;transform-origin:0 0;will-change:transform}
.totop{position:fixed;right:20px;bottom:20px;width:44px;height:44px;box-sizing:border-box;border:0;border-radius:50%;background:#111111;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:999;opacity:0;visibility:hidden;transform:translateY(8px) scale(1);box-shadow:0 4px 14px rgba(0,0,0,.18);transition:opacity .25s ease-out,transform .2s ease-out,background-color .15s ease-out,box-shadow .2s ease-out,visibility 0s linear .25s}
.totop.on{opacity:1;visibility:visible;transform:translateY(0) scale(1);transition:opacity .25s ease-out,transform .2s ease-out,background-color .15s ease-out,box-shadow .2s ease-out,visibility 0s}
.totop.on:hover{background:#3A3D43;transform:translateY(-2px) scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.24)}
.totop.on:active{background:#000000;transform:translateY(0) scale(.92);box-shadow:0 2px 8px rgba(0,0,0,.2);transition-duration:.08s}
</style></head><body>

생성).\"],[\"트리거\",\"버튼 위에 마우스를 올렸을 때.\"],[\"반응\",\"화살표가 오른쪽으로 이동하고, 마우스를 내리면 원래 위치로 복귀. 이징은 ease in-out.\"],[\"수정\",\"· 버튼을 텍스트를 감쌀 크기로 줄이고 양 끝이 반원인 pill 형태로 변경, 전체 크기 20% 축소\\n· 화살표 이동 거리 10pt → 5pt\\n· 모든 인터랙션 왼쪽 상단에 번호와 타이틀을 작은 회색 글씨로 표기\"]]},\"2\":{\"t\":\"마그네틱 버튼\",\"r\":[[\"오브젝트\",\"'이끌리는 버튼' 텍스트가 들어간 검정 버튼.\"],[\"트리거\",\"마우스가 버튼 주변에 접근할 때.\"],[\"반응\",\"버튼이 마우스를 향해 움직이며 따라옴.\"],[\"조건\",\"감지 범위는 버튼 주변 15pt로 제한, 이동 거리도 15pt를 넘지 않음.\"],[\"수정\",\"· 따라갈 때는 ease out, 원위치로 돌아올 때는 spring 적용\\n· 감지 범위는 유지하되, 따라갈 수 있는 범위는 #2 캔버스 영역 전체로 확대\\n· 복귀 조건: 마우스가 버튼에서 빠르게 멀어지거나 범위를 벗어날 때\\n· 버튼은 마우스 이동 거리에 비례해 버튼 주변 40pt 안에서만 이동\\n· 마우스 속도 기준을 높여 더 쫀쫀하게 붙도록 조정, spring 효과 강화\"]]},\"3\":{\"t\":\"블러 투 포커스\",\"r\":[[\"오브젝트\",\"'흐릿했던 문장이 선명해진다' 문장.\"],[\"트리거\",\"글자 위에 마우스를 올렸을 때.\"],[\"반응\",\"블러가 사라지고, 마우스를 내리면 다시 블러 처리. 이징은 ease out.\"]]},\"4\":{\"t\":\"호버 줌\",\"r\":[[\"오브젝트\",\"좌우로 나란히 놓인 모서리가 둥근 카드 2장(금색·은색, 둘 다 좌측 상단 빛 그라데이션).\"],[\"트리거\",\"각 카드에 마우스를 올렸을 때.\"],[\"반응\",\"올린 카드가 줌인되며 내부에 '#1', '#2' 글자가 나타남. 글자는 카드 왼쪽 하단에서 위로 올라오며 opacity가 함께 증가하고, 마우스를 내리면 줌아웃되며 내려가면서 사라짐. 줌 이징은 ease out, 글자는 흰색 약 7pt.\"],[\"수정\",\"· 카드 세로 길이를 가로 길이보다 살짝 짧게 조정\"]]},\"5\":{\"t\":\"애니메이티드 언더라인\",\"r\":[[\"오브젝트\",\"'포트폴리오', '소개', '연락' 텍스트가 한 줄로 나열.\"],[\"트리거\",\"각 텍스트에 마우스를 올렸을 때.\"],[\"반응\",\"텍스트 아래에 왼쪽에서 오른쪽으로 언더라인이 그려지고, 마우스를 내리면 다시 왼쪽으로 사라짐. ease out 적용, 두께 2pt.\"],[\"수정\",\"· 언더라인 두께를 1pt로 조정\\n· 선이 오른쪽 끝까지 찼을 때 두께가 다시 2pt로 돌아가는 문제 수정\"]]},\"6\":{\"t\":\"커스텀 커서\",\"r\":[[\"오브젝트\",\"#6 인터랙션 범위에 해당하는 캔버스 영역.\"],[\"트리거\",\"마우스가 범위 안에서 움직일 때.\"],[\"반응\",\"기본 커서를 흰 원(희미한 회색 아웃라인)으로 교체해 마우스를 실시간으로 따라가게 함. 범위에 들어올 때 opacity를 ease out으로 나타내고, 나갈 때도 같은 방식으로 사라지게 함.\"],[\"수정\",\"· 커서 크기를 지름 30pt 원으로 변경\"]]},\"7\":{\"t\":\"머물면 뜨는 정보카드\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드 안에 '공지 · 오늘 오전 10:12'(작은 회색)와 이어지는 본문 '이번 주 회의는 김서연님이 진행하고, 발표 자료는 박도윤님이 정리해서 공유할 예정입니다. 질문은 금요일까지 남겨 주세요.'(일반 크기). '김서연'과 '박도윤'은 볼드·언더라인·파란 글씨.\"],[\"트리거\",\"'김서연' 또는 '박도윤'에 마우스를 올렸을 때.\"],[\"반응\",\"0.3초 딜레이 후 해당 이름 위에 말풍선 카드가 나타남. 아래에서 위로 스케일 0→100, 통통 튀는 spring 이징. 카드 안에는 상단에 이름이 들어간 원형 프로필, 오른쪽에 큰 성/이름과 그 아래 회색 '프로덕트 디자이너', 하단에 '모바일 결제 흐름과 온보딩 화면을 맡고 있어요' 설명. 마우스를 떼면 ease in으로 원상복귀.\"]]},\"8\":{\"t\":\"스태거 리빌\",\"r\":[[\"오브젝트\",\"모서리가 둥근 사각형 카드 3장.\"],[\"트리거\",\"스크롤을 내려 카드가 화면 중앙에 가까워질 때.\"],[\"반응\",\"카드가 아래에서 위로 올라오며 opacity 0→100. ease out, 왼쪽부터 0.2초 간격으로 순차 등장. 오른쪽 상단(타이틀 반대편)에 스크롤을 이미 내린 상태에서도 다시 확인할 수 있는 작은 '다시보기' 버튼 배치.\"],[\"수정\",\"· 카드 세로 길이를 가로보다 짧게 조정 (이후 카드는 항상 이 비율로 생성)\\n· 아래쪽 여백 소폭 축소\"]]},\"9\":{\"t\":\"패럴랙스\",\"r\":[[\"오브젝트\",\"범위를 가득 채우는 뒷면 레이어(대각선 흰색·회색 줄무늬)와, 검정 버튼 형태로 '앞면 레이어'라고 적힌 앞면 레이어.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"앞면 레이어는 스크롤 속도대로 움직이고, 뒷면 레이어는 더 느리게 움직여 두 층이 분리되어 보이게 함.\"],[\"수정\",\"· 효과가 잘 보이도록 줄무늬를 더 두껍게, 스크롤 움직임에 ease out 적용\\n· 느려진 속도에 맞춰 뒷면의 이동 거리도 더 줄임\"]]},\"10\":{\"t\":\"스크롤 프로그레스\",\"r\":[[\"오브젝트\",\"가로:세로 10:8 비율의 텍스트 박스. 안에는 스크롤 프로그레스의 원리와 용도를 설명하는 여러 문단이 들어 있음('이 상자 안에서 스크롤해 보세요…' ~ '끝까지 내리면 줄이 꽉 찹니다').\"],[\"트리거\",\"박스 위에 마우스를 올리고 스크롤할 때.\"],[\"반응\",\"스크롤을 내리면 박스 위쪽 모서리에 왼쪽부터 진행선이 차오르고, 오른쪽에는 스크롤 인디케이터 표시. ease out 적용.\"],[\"수정\",\"· 텍스트 상자 세로 비율 축소, 가로 길이 10% 축소(가운데 기준)\\n· #9와 #10 사이 간격 축소\"]]},\"11\":{\"t\":\"마스크드 텍스트 리빌\",\"r\":[[\"오브젝트\",\"'문장이 줄 단위로, / 아래에서 걷히듯, / 차례로 나타난다.' 3줄 텍스트.\"],[\"트리거\",\"스크롤할 때.\"],[\"반응\",\"스크롤 범위에 따라 한 줄씩 아래에서 위로 나타남.\"],[\"수정\",\"· '다시보기' 버튼 추가\\n· 타이틀과 내용 사이 간격을 절반으로 축소\"]]},\"12\":{\"t\":\"스크롤 피닝\",\"r\":[[\"오브젝트\",\"인터랙션 범위를 거의 채우는 사각형 카드.\"],[\"트리거\",\"페이지를 스크롤할 때.\"],[\"반응\",\"처음에는 아이보리 배경에 '1단계 - 계속 스크롤', 1/3 지점을 지나면 민트색 배경에 '2단계 - 색이 바뀌고', 3단계에서는 검정 배경·흰 글씨로 '3단계 - 완료!'로 변경.\"],[\"조건\",\"카드와 타이틀을 포함한 인터랙션 범위가 화면 중앙에 닿으면 3단계에 이를 때까지 중앙에 머무름(페이지는 계속 스크롤). 일반 인터랙션 범위의 약 6배 영역 할당.\"],[\"수정\",\"· 고정 방식을 스크롤 속도에 맞춰 범위가 함께 아래로 이동하는 방식으로 바꿔 떨림 방지\\n· 오타 수정('색이 바뀌고')\\n· 아트보드 하단까지 가능한 한 넓은 범위 부여\"]]},\"13\":{\"t\":\"오토하이드 헤더\",\"r\":[[\"오브젝트\",\"#10과 같은 텍스트 상자(스크롤 프로그레스 바 없음). 상자 상단에 '헤더'라고 적힌 헤더 박스. 본문은 오토하이드 헤더의 원리를 설명하는 문단들('이 상자 안에서 아래로 내려 보세요 — 위 헤더가 숨습니다.' ~ '지금 위로 올려 보세요.').\"],[\"트리거\",\"텍스트 상자 안에서 스크롤할 때.\"],[\"반응\",\"아래로 스크롤하면 헤더가 위로 올라가 숨고, 위로 스크롤하면 다시 내려와 나타남. ease out 적용.\"]]},\"14\":{\"t\":\"드래그 캐러셀\",\"r\":[[\"오브젝트\",\"범위 안에 사각형 카드 5장(가운데에 1~5 숫자, 파스텔 톤 랜덤 색상). 1번부터 왼쪽에 정렬하고, 3번은 오른쪽 경계에 걸쳐 보이며 4·5번은 범위 밖에 있어 보이지 않음.\"],[\"트리거\",\"카드가 놓인 영역을 잡고 드래그할 때.\"],[\"반응\",\"카드들이 함께 좌우로 이동해 5번 카드까지 확인할 수 있음. 1번이 맨 왼쪽, 5번이 맨 오른쪽에 올 때까지만 이동 가능.\"],[\"조건\",\"한계에 닿으면 경계 저항 구현.\"]]},\"15\":{\"t\":\"비포/애프터\",\"r\":[[\"오브젝트\",\"좌우를 꽉 채우는 사각형 카드. 중앙에 세로선 핸들이 있고, 핸들 왼쪽은 포레스트 그린, 오른쪽은 버건디.\"],[\"트리거\",\"핸들을 잡고 좌우로 드래그할 때.\"],[\"반응\",\"핸들 위치에 따라 영역이 조정되어, 핸들 왼쪽은 그린, 오른쪽은 버건디로 채워짐.\"],[\"조건\",\"핸들은 카드 좌우 최대 97% 위치까지만 이동 가능.\"],[\"수정\",\"· 핸들 표시를 지우고 선 자체가 핸들로 동작하게 변경\\n· 두 색을 파스텔 톤으로 교체\\n· 카드 양 끝이 범위에서 살짝 떨어지도록 하고 모서리를 둥글게 처리\"]]},\"16\":{\"t\":\"로터리 다이얼\",\"r\":[[\"오브젝트\",\"중심에 검정 원형 다이얼과 그 위의 짧은 흰색 인디케이터. 다이얼 주변에는 6등분된 회색 위치 인디케이터. 다이얼 오른쪽에는 '작품 1' 텍스트.\"],[\"트리거\",\"다이얼을 드래그할 때.\"],[\"반응\",\"다이얼이 회전하며 인디케이터가 위치 인디케이터에 맞춰짐. 드래그를 놓으면 가장 가까운 위치로 ease out 스냅. 맨 위에서 시계 방향으로 1~6이 되며 '작품' 뒤 숫자가 바뀌고, 드래그 중에도 가장 가까운 위치 기준으로 숫자가 변경됨.\"],[\"수정\",\"· 가장 가까운(선택된) 위치 인디케이터는 살짝 더 두꺼운 검정 선으로 표시\"]]},\"17\":{\"t\":\"드래그 앤 드롭 정렬\",\"r\":[[\"오브젝트\",\"좌우로 길고 위아래로 짧은 회색 카드 3개('첫번째 항목', '두번째 항목', '세번째 항목')가 세로로 정렬.\"],[\"트리거\",\"카드를 집어 드래그할 때.\"],[\"반응\",\"집은 카드가 살짝 줌인되고 drop shadow로 떠 있는 느낌을 줌. 위아래로 움직이면 다른 카드들이 따라 재정렬되어 순서를 바꿀 수 있음. 레이아웃은 초기와 동일하게 유지하고 순서만 변경, 드래그 중인 카드는 맨 앞에 표시.\"]]},\"18\":{\"t\":\"슬라이더 매핑\",\"r\":[[\"오브젝트\",\"왼쪽에 밝은 노란색으로 채워진 원, 오른쪽에 흰색/검정 슬라이더.\"],[\"트리거\",\"슬라이더 핸들을 잡고 좌우로 움직일 때.\"],[\"반응\",\"슬라이더에 따라 원의 조도가 변하고, 슬라이더 왼쪽은 검정이 차오르며 오른쪽은 흰색으로 보임.\"],[\"수정\",\"· 조도가 바뀌는 방향을 반대로 변경\\n· 원 주변 glow 이펙트 제거, 노란색을 더 낮은 채도로 변경\"]]},\"19\":{\"t\":\"컨디셔널 스테이트\",\"r\":[[\"오브젝트\",\"위와 같은 슬라이더를 배치하고 왼쪽에 '준비' 텍스트.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"1/3 지점을 넘으면 '익는 중', 2/3 지점을 넘으면 '완성'으로 변경. 새 글자는 아래에서 위로 올라오며 opacity 0→100, 모두 ease out.\"],[\"수정\",\"· 왼쪽으로 돌아갈 때도 글자가 나타나는 방식은 동일하게 유지\\n· 기존 글자는 duration 없이 즉시 사라지도록 변경\"]]},\"20\":{\"t\":\"테마 토글\",\"r\":[[\"오브젝트\",\"'지금 테마 · 라이트' 텍스트와 오른쪽 스위치, 두 요소를 감싸는 밝은 회색 카드.\"],[\"트리거\",\"스위치를 토글할 때.\"],[\"반응\",\"카드가 검정으로, 텍스트가 흰색으로 바뀌고 '라이트'가 '다크'로 변경. 카드 폭은 텍스트 길이에 따라 자동 조정되며 ease out, 텍스트는 opacity가 서서히 변함.\"],[\"수정\",\"· 라이트 테마 느낌이 나도록 밝은 회색에 약간의 노란 톤 추가\"]]},\"21\":{\"t\":\"프로그레스 게이지\",\"r\":[[\"오브젝트\",\"좌우로 프로그레스 바와 슬라이더를 배치하고, 가운데에 바가 채워진 비율만큼의 숫자 표시.\"],[\"트리거\",\"슬라이더를 잡고 드래그할 때.\"],[\"반응\",\"프로그레스 바가 슬라이더에 맞춰 채워지거나 비워지고, 숫자는 0~100으로 변경. 변화에 ease out 적용.\"]]},\"22\":{\"t\":\"프리셋 리콜\",\"r\":[[\"오브젝트\",\"슬라이더 2개를 위아래로 배치하고 각각 왼쪽에 작은 '온도', '시간' 텍스트, 오른쪽에 채움 비율(%). 슬라이더 아래에 '세팅 1', '세팅 2' 버튼, 그 아래 작은 안내 문구 '기본 프리셋이 들어 있어요 — 탭해 보세요'. 우측 상단에는 타이틀과 같은 스타일로 '길게 누르면 저장 · 탭하면 불러오기'.\"],[\"트리거\",\"슬라이더 드래그 / 버튼 탭 / 버튼 길게 누르기.\"],[\"반응\",\"드래그하면 오른쪽 숫자가 백분율로 변함. 버튼을 탭하면 저장된 값으로 슬라이더가 이동(세팅 1: 온도 80·시간 20, 세팅 2: 온도 60·시간 35)하며 문구가 '세팅 N 불러오는 중 — 슬라이더가 움직여요'로 변경. 버튼을 길게 누르면 현재 슬라이더 위치가 해당 세팅 값으로 새로 저장되고 문구가 '세팅 N에 저장했어요'로 변경.\"],[\"수정\",\"· 세팅 1·2 버튼 색상을 옅은 노란색, 텍스트는 검정으로 변경\"]]},\"23\":{\"t\":\"푸시 트랜지션\",\"r\":[[\"오브젝트\",\"세로로 긴 카드. 상단에 '내 작품' 헤더, 그 아래 '작품 1', '작품 2', '작품 3' 항목이 얇은 선으로 구분되어 세로 정렬. 헤더를 제외한 항목 옆에는 작은 화살표.\"],[\"트리거\",\"화살표 또는 화살표가 붙은 항목을 탭할 때.\"],[\"반응\",\"카드가 옆으로 넘어가며 헤더가 탭한 항목 이름으로 바뀜. 헤더 왼쪽에 뒤로가기 화살표가 생겨 누르면 이전 화면으로 복귀. 상세 화면은 중앙에 다른 색의 작은 사각형 카드, 그 아래 'push 전환으로 들어온 상세화면' 텍스트.\"]]},\"24\":{\"t\":\"바텀 시트\",\"r\":[[\"오브젝트\",\"사각형 카드, 중앙에 '시트 열기' 텍스트의 검정 버튼. 카드 하단에는 shadow 그라데이션.\"],[\"트리거\",\"'시트 열기' 버튼을 탭할 때.\"],[\"반응\",\"아래에서 바텀 시트가 올라와 화면의 60%를 덮음. 패널에는 굵은 '아래서 올라온 커버'와 얇은 '핸들을 탭하면 닫혀요'. shadow 그라데이션도 시트와 함께 올라오고, 시트 상단 중앙의 선 모양 핸들을 탭하면 시트가 아래로 내려가 닫힘.\"],[\"수정\",\"· 카드 윤곽선이 살짝 보이도록 수정\"]]},\"25\":{\"t\":\"슬라이딩 탭 인디케이터\",\"r\":[[\"오브젝트\",\"가로로 긴 '홈 / 보관함 / 설정' 탭. 처음에는 '홈' 위에 검정 선 인디케이터.\"],[\"트리거\",\"탭 안의 각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트 위쪽으로 선 인디케이터가 이동. 각 탭 영역은 텍스트 길이에 따라 배정하고, 인디케이터 길이도 영역에 맞춰 조정. ease in-out 적용.\"],[\"수정\",\"· 탭 전체를 사각형 카드로 감싸 중앙에 배치\\n· 카드 색과 인디케이터가 선택되지 않은 부분의 색을 통일하고, 카드 모서리 둥글기 감소\"]]},\"26\":{\"t\":\"카드 플립 시퀀스\",\"r\":[[\"오브젝트\",\"'스', '마', '트', '인', '터' 글자별 작은 아이보리 사각형 카드를 수평 정렬하고, 맨 오른쪽에 모서리를 더 둥글게 한 버튼 모양의 '재생' 카드(아이보리).\"],[\"트리거\",\"'재생' 버튼을 탭할 때.\"],[\"반응\",\"왼쪽부터 각 카드가 위아래로 2바퀴 뒤집히며 검정으로 변함. 카드별 0.2초 딜레이(재생 카드 제외). 모든 카드가 바뀌고 2초 뒤 전부 동시에 원래 색으로 복귀.\"],[\"수정\",\"· 원상태로 돌아가는 duration을 0.5초로 증가\"]]},\"27\":{\"t\":\"와이프 트랜지션\",\"r\":[[\"오브젝트\",\"범위의 절반 정도 크기의 아이보리 사각형 카드('화면 1' 텍스트)와, 카드 옆의 아이보리 '전환' 버튼.\"],[\"트리거\",\"'전환' 버튼을 탭할 때.\"],[\"반응\",\"카드 왼쪽에서 오른쪽으로 검정이 와이프되어 채워지고, 다 채워지면 검정이 0.2초 동안 opacity 0으로 사라지며 '화면 2'가 나타남. 다시 누르면 같은 방식으로 '화면 1'로 복귀.\"]]},\"28\":{\"t\":\"버튼이 펼쳐지는 메뉴\",\"r\":[[\"오브젝트\",\"범위 대부분을 덮는 사각형 카드. 좌측 상단에 큰 '스케치 내용 정리' 텍스트와 다양한 요소들이 있고, 우측 상단에는 텍스트 크기 정도의 원형 버튼(가운데 가로 점 3개).\"],[\"트리거\",\"원형 버튼을 탭할 때.\"],[\"반응\",\"버튼에서 시작해 버튼을 가리며 왼쪽 아래로 사각형 메뉴 카드가 펼쳐짐. 메뉴는 '이름 바꾸기', '공유', '복제', '보관', '삭제'가 세로로 나열되고 각 텍스트 앞에 아이콘이 있으며, 삭제 메뉴와 아이콘은 빨간색. 메뉴와 버튼은 마우스를 올리면 색이 진해짐. 메뉴를 클릭하거나 카드 바깥을 탭하면 다시 접힘.\"],[\"수정\",\"· 버튼 클릭이 동작하지 않는 문제 수정\\n· '컬러' 오타 수정, 추가 요소들의 색상은 회색으로 통일\"]]},\"29\":{\"t\":\"펼침·접힘 목록\",\"r\":[[\"오브젝트\",\"넓은 사각형 카드. 카드 바깥 왼쪽 위에 큰 '자주 묻는 질문'. 카드 안에는 '수업 자료는 어디서 받나요?', '과제 제출 기한을 넘기면 어떻게 되나요?', '팀은 어떻게 정하나요?', '노트북이 꼭 필요한가요?', '결석하면 보강이 있나요?' 5개 메뉴가 세로로 나열되고 각 항목 오른쪽 끝에 V자 화살표.\"],[\"트리거\",\"각 메뉴를 탭할 때.\"],[\"반응\",\"메뉴 텍스트와 화살표가 파란색으로 바뀌고 화살표는 위아래로 뒤집힘. 메뉴가 아래로 늘어나며 질문에 대한 답변(임의 작성)이 약간 작은 회색 글씨로 표시됨.\"],[\"조건\",\"한 번에 하나의 메뉴만 열림. 열려 있는 메뉴를 다시 탭하면 원래대로 닫힘.\"]]},\"30\":{\"t\":\"풀 투 리프레시\",\"r\":[[\"오브젝트\",\"세로로 긴 좁은 사각형 카드. 안에 '메세지 1' ~ '메세지 4'가 메뉴 형식으로 세로 배치.\"],[\"트리거\",\"카드를 드래그해 아래로 당길 때.\"],[\"반응\",\"당기는 만큼 카드 상단에 회색 배경이 내려오고 회전 화살표가 opacity와 함께 나타남. 더 당길수록 화살표가 시계 방향으로 회전. 메뉴 한 칸 높이 이상 당긴 뒤 놓으면 상단 배경이 한 칸 높이로 맞춰져 1초간 유지되고 화살표가 빠르게 한 바퀴 돈 뒤 영역이 다시 닫힘.\"],[\"수정\",\"· 메뉴는 누르는 동안에만 배경색보다 살짝 밝은 회색으로 변경\\n· 화살표는 직선 화살표가 아닌 ↻ 모양으로 변경\\n· 회전 화살표는 놓은 시점부터 한 바퀴 회전(Rotate to가 아닌 Rotate by)\"]]},\"31\":{\"t\":\"파티클 버스트\",\"r\":[[\"오브젝트\",\"화면 중앙의 작은 입체감 있는 흰색 하트.\"],[\"트리거\",\"하트를 탭할 때.\"],[\"반응\",\"하트가 빨간색으로 바뀌며 스케일이 spring으로 잠시 커졌다 줄어듦. 빨간색으로 바뀔 때 중앙에서 빨간 링이 퍼져나가고, 링과 함께 작은 하트 9개가 바깥으로 뻗어나감. 링과 하트는 opacity 약 60%. 다시 탭하면 흰색 하트로 돌아가며 링과 하트 효과는 생략.\"],[\"수정\",\"· 링 두께 약 10px, 퍼져나가는 효과 구현 수정\\n· 링 최종 지름을 절반 정도로 축소, 하트는 더 키우고 링과 같은 지점에서 시작해 링보다 20px 더 이동\\n· 링은 처음에 얇다가 퍼지며 두꺼워지도록 변경\\n· 하트 자체의 회전 각도를 좌우 ±30° 내에서 랜덤하게, 크기도 ±15% 범위에서 조금씩 다르게\\n· 퍼져나가는 거리도 ±10px 범위에서 조금씩 다르게\"]]},\"32\":{\"t\":\"스켈레톤 UI\",\"r\":[[\"오브젝트\",\"범위 안에 굵은 '로딩이 끝난 진짜 제목'과 가는 '본문 내용이 여기 들어갑니다'를 위아래로 배치하고, 오른쪽에 아이보리 '새로고침' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"텍스트 레이아웃을 보여주는 둥근 박스 2개가 딜레이 없이 3초간 나타남. 3초 후 박스는 빠르게 사라지고 기존 텍스트가 각 줄별로 아래에서 위로 올라오며 나타남. 박스 안에는 로딩 표시로 색이 조금씩 변하는 wave 효과.\"]]},\"33\":{\"t\":\"스와이프 액션\",\"r\":[[\"오브젝트\",\"'밀 수 있는 셀' 텍스트가 들어간, 가로로 길고 위아래는 텍스트를 감쌀 정도인 회색 사각형 카드.\"],[\"트리거\",\"카드를 왼쪽 또는 오른쪽으로 드래그할 때.\"],[\"반응\",\"왼쪽으로 드래그하면 오른쪽 끝에서 빨간 영역이 나오고, 당기는 만큼 '삭제' 텍스트의 opacity가 올라 텍스트 폭을 넘으면 100%. 반대로 당기면 같은 반응으로 왼쪽에서 파란 영역과 '보관' 텍스트.\"],[\"조건\",\"당긴 정도가 절반 이하면 텍스트가 보일 만큼만 고정, 절반 이상이면 카드가 완전히 넘어가며 색으로 가득 참(텍스트를 탭해도 동일). 이후 3초 뒤 원상 복귀.\"],[\"수정\",\"· 살짝 밀린 상태에서 다시 원래 위치로 밀면 초기 상태로 복귀\\n· 가득 찬 뒤 복귀는 opacity가 아니라 카드 아래 모서리가 위로 올라오며 사라지는 방식: 0.5초 사라짐 → 2초 유지 → 0.5초 나타남, ease out\\n· 드래그가 끊기고 버벅이는 느낌 개선\"]]},\"34\":{\"t\":\"시간 경과 상태 변화\",\"r\":[[\"오브젝트\",\"왼쪽에 밝고 낮은 채도의 노란 원, 그 옆에 굵은 '설정하세요'와 그 아래 작고 얇은 회색 '0%'. 범위 오른쪽에 검정 '시작' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"원의 색이 조금씩 갈색으로 변하고 퍼센트가 실시간으로 올라감(초당 12%p). 텍스트는 '굽는 중' → 33% '익어가는 중' → 66% '거의 다 됐어요' → 100% '완성' → 126% '탔어요'. 최대 180%. 95%는 고동색, 120%는 어두운 암갈색, 150%는 검정에 가까운 갈색으로, 초기 색에서 명도만 조정해 표현.\"],[\"수정\",\"· 초기 색에 채도를 더해 갈색이 더 갈색답게, 100% 색은 현재보다 살짝 더 갈색 느낌으로\\n· 시작 후 버튼이 '정지'로 바뀌고 탭하면 초기화, 180%에 도달하면 '다시'로 바뀌고 탭하면 바로 재시작\"]]},\"35\":{\"t\":\"인라인 검증\",\"r\":[[\"오브젝트\",\"가로로 긴 텍스트 상자(플레이스홀더 'a@b.com 처럼 쳐 보세요')와 그 아래 작은 회색 텍스트 '@가 들어가면 통과합니다'.\"],[\"트리거\",\"텍스트 상자에 입력을 시작할 때.\"],[\"반응\",\"상자 모서리와 아래 텍스트가 빨간색이 되며 '@가 필요합니다'로 변경. @가 입력되면 '@ 뒤에 주소가 필요합니다'. 이후 아무 텍스트나 입력되면 모서리와 텍스트가 약간 어두운 노랑으로, '조금만 더 — 주소에 점이 필요합니다'. '.'이 입력되면 초록색, '좋아요'. 처음부터 @를 입력하면 빨간색과 '@ 앞에 이름이 필요합니다'.\"]]},\"36\":{\"t\":\"문자수 카운터\",\"r\":[[\"오브젝트\",\"가로로 넓고 2줄 정도 들어가는 텍스트 상자(플레이스홀더 '40자까지 편하게, 60자가 한계'). 우측 하단에 작은 회색 '0 / 40'.\"],[\"트리거\",\"상자에 타이핑할 때.\"],[\"반응\",\"글자 수에 따라 '0' 숫자가 증가. 33~40자는 '0 / 40'이 어두운 노랑, 41~60자는 빨강.\"],[\"조건\",\"글자 수가 60이면 더 이상 입력 불가.\"]]},\"37\":{\"t\":\"스텝퍼\",\"r\":[[\"오브젝트\",\"중앙에 굵고 큰 숫자 '0', 왼쪽에 원형 회색 − 버튼, 오른쪽에 + 버튼.\"],[\"트리거\",\"각 버튼을 탭하거나 홀드할 때.\"],[\"반응\",\"− 버튼은 숫자를 감소, + 버튼은 증가시킴. 홀드하면 1초 딜레이 후 연속 증감하고, 홀드 시간이 길수록 속도가 빨라지며 한계 속도가 존재.\"],[\"조건\",\"숫자는 0 미만이나 99 초과가 될 수 없음.\"],[\"수정\",\"· 초기 속도 1초당 4, 한계 속도 1초당 14로 조정하고 속도 증가율을 높임 (여러 차례 단계적으로 조정)\"]]},\"38\":{\"t\":\"세그먼트 컨트롤\",\"r\":[[\"오브젝트\",\"양 끝이 반원인 회색 막대형 탭 바에 '강', '중', '약' 텍스트. 처음에는 '강' 부분에 흰색 짧은 막대형 인디케이터가 있고 '강'은 검정, 나머지는 회색.\"],[\"트리거\",\"각 텍스트를 탭할 때.\"],[\"반응\",\"탭한 텍스트는 검정, 나머지는 회색으로 바뀌고 인디케이터가 해당 텍스트로 이동.\"]]},\"39\":{\"t\":\"세그먼트 다이얼\",\"r\":[[\"오브젝트\",\"큰 링 안에 회색 'Level' 텍스트, 링 오른쪽에 굵고 큰 숫자 '0'과 그 아래 작은 회색 '스팀 단계 (0~3)'. 링은 12시에서 3시까지 1/4만 검정으로 채워져 있고, 12시 끝은 직선, 3시 끝은 반원.\"],[\"트리거\",\"링을 탭할 때.\"],[\"반응\",\"3~6시 지점을 탭하면 그 위치까지 채워지며 숫자 1, 6~9시는 2, 9~12시는 3으로 변경. 반원 끝이 링을 따라 이동하며 채워지고, ease in-out 0.5초.\"]]},\"40\":{\"t\":\"토스트\",\"r\":[[\"오브젝트\",\"정사각형보다 살짝 가로가 넓은 사각형 카드. 상단에 회색 '저장 버튼을 눌러보세요', 중하단에 검정 '저장' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"카드 하단에서 카드 폭보다 살짝 좁은, 한 줄짜리 검정 박스가 위로 올라옴. 안에는 흰색 '저장했습니다'. opacity를 조절하며 나타났다가 2초 뒤 반대로 사라짐. spring 적용.\"],[\"수정\",\"· spring 효과를 살짝 감소\\n· 토스트 팝업 속도를 더 빠르게\"]]},\"41\":{\"t\":\"언두 스낵바\",\"r\":[[\"오브젝트\",\"#40과 같은 사각형 카드. 상단에 '읽지 않은 메일 1통'이 들어간 가로로 긴 메일 카드, 중하단 중앙에 작은 '삭제' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"메일 카드가 사라지고, 직후 카드 하단에 #40과 같은 토스트가 올라옴. 토스트 왼쪽에 흰색 '삭제됨', 오른쪽에 형광 청록색 '되돌리기'. '되돌리기'를 탭하면 메일 카드가 원상 복귀. 토스트가 사라지는 방식은 #40과 동일.\"],[\"수정\",\"· 토스트 팝업 속도를 #40처럼 증가\\n· 메일 카드가 삭제된 상태에서도 버튼을 누르면 동일하게 토스트가 뜨도록 수정\\n· 메일 카드는 오른쪽에서 왼쪽으로 스와이프되며 사라지고, 나타날 때는 반대 방향\"]]},\"42\":{\"t\":\"셰이크 거부\",\"r\":[[\"오브젝트\",\"한 줄 텍스트 상자(플레이스홀더 '비밀번호는 1234 입니다'), 오른쪽 끝에 눈 모양 아이콘, 상자 아래 양 옆이 반원인 검정 '확인' 버튼.\"],[\"트리거\",\"텍스트 입력 / 입력 후 버튼 탭.\"],[\"반응\",\"입력한 텍스트는 '•'로 표시. 눈 아이콘을 탭하면 원래 텍스트가 보이며 토글 방식. 버튼을 탭하면 입력값에 따라 반응.\"],[\"조건\",\"1234이면 상자 모서리가 초록색으로 바뀌며 스케일이 커졌다 돌아옴. 1234가 아니면 상자 모서리가 빨간색으로 바뀌고 좌우로 2회 흔들림.\"],[\"수정\",\"· 1234일 때 스케일 변화를 10% → 5%로 조정\"]]},\"43\":{\"t\":\"확인 홀드\",\"r\":[[\"오브젝트\",\"중앙에 빨간색 '꾹 눌러 초기화' 버튼.\"],[\"트리거\",\"버튼을 홀드할 때.\"],[\"반응\",\"버튼 왼쪽에서부터 적갈색이 서서히 채워지고, 오른쪽 끝까지 채워지면 버튼 아래에 작은 회색 '초기화했습니다'가 나타남. 0.5초 뒤 버튼 색이 원복되고 텍스트는 2초간 유지.\"],[\"수정\",\"· 이후 버튼은 별도 언급이 없으면 양 옆이 반원인 pill 형태로, 폭은 텍스트에 맞춰 생성\"]]},\"44\":{\"t\":\"진행을 보여주는 버튼\",\"r\":[[\"오브젝트\",\"가로로 긴 큰 사각형 카드. 상단 좌측에 회색 '받는 사람', 그 오른쪽에 작은 원형 프로필과 '디자인 팀'을 반원 박스로 묶어 배치. 아래는 파티션으로 나누고 본문 '시안 3종 첨부했습니다. 금요일 리뷰 전에 한 번씩 확인 부탁드려요.'. 하단 좌측에 스켈레톤 느낌의 사각형 2개, 하단 우측에 파란 '보내기' 버튼.\"],[\"트리거\",\"버튼을 탭할 때.\"],[\"반응\",\"버튼 채도가 살짝 낮아지고 '보내기' 왼쪽에 회전하는 원형 로딩 바가 나타나며 '보내는 중'으로 변경. 1.2초 후 버튼이 채도 낮은 초록색, 텍스트는 진한 초록의 '보냄'으로 바뀌고 로딩 바는 체크가 그려지는 애니메이션의 초록 체크로 변경. 2초 유지 후 처음 상태로 복귀.\"],[\"수정\",\"· '보내는 중' 색상은 낮은 채도의 파랑이 아니라 기본 파랑에 틴트를 넣는 방식으로\\n· '디자인 팀' 프로필에 사선 곡선의 파란 그라데이션 적용\"]]},\"45\":{\"t\":\"카운트 업\",\"r\":[[\"오브젝트\",\"화면 중앙에 크고 굵은 숫자 3개, 각 숫자 아래 작은 회색 '참여자', '만족도 %', '국가'.\"],[\"트리거\",\"스크롤을 내려 화면에 보일 때.\"],[\"반응\",\"각 숫자가 빠르게 커지며 왼쪽부터 '1,284', '96', '37'에 도달. 빠르게 시작해 서서히 느려지며 2초간 진행.\"],[\"조건\",\"숫자의 최종 글자 수를 고려해 공간 배치.\"],[\"수정\",\"· #11의 '다시보기' 버튼과 동일한 버튼을 같은 역할로 추가\\n· 진행 시간 2.5초 → 2초\\n· #45~47의 여백은 필수 공간만 남기고 압축한 뒤, 살짝 여유를 더함\"]]},\"46\":{\"t\":\"타이핑 효과\",\"r\":[[\"오브젝트\",\"처음에는 화면에 아무것도 없음.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"'명세서를 쓰고, 만들고, 다듬는다' 텍스트가 범위 중앙에서 시작해 양옆으로 늘어나며 한 글자씩 타이핑됨. 출력되는 동안 텍스트 맨 오른쪽에 글자 높이의 세로 검정 박스(커서)가 있다가 출력이 끝나면 사라짐.\"],[\"수정\",\"· #45와 같은 '다시보기' 버튼 추가\\n· 타이핑 속도를 조금 더 빠르게\"]]},\"47\":{\"t\":\"텍스트 스크램블\",\"r\":[[\"오브젝트\",\"중앙의 'SMART INTERACTION' 텍스트.\"],[\"트리거\",\"스크롤하여 페이지에 보일 때.\"],[\"반응\",\"각 알파벳이 빠르게 랜덤한 알파벳이나 특수기호로 바뀌다가 왼쪽부터 한 글자씩 원래 글자로 확정됨. 총 2초간 진행.\"],[\"조건\",\"'S'는 처음부터 S로 고정되어 변하지 않음.\"],[\"수정\",\"· '다시보기' 버튼 추가\"]]},\"48\":{\"t\":\"바뀐 자리만 굴러가는 숫자\",\"r\":[[\"오브젝트\",\"상단 중앙에 '월간'/'연간'을 고르는 양 끝 반원 탭. '연간' 오른쪽에는 틴트된 초록 프레임에 작은 초록 글씨 '-20%'. 그 아래 세로로 살짝 긴 카드 3장을 가로로 배치. 각 카드는 상단 왼쪽에 플랜명, 아래에 '₩_,___/월'(₩는 살짝 크게, 숫자는 굵고 크게, /월은 회색 보통), 파란 원 불릿 3줄 설명, 그 아래 카드 폭보다 살짝 좁은 버튼. 카드 내용: 베이직 9,900 / 프로젝트 3개·저장공간 5GB·기본 템플릿 / 시작하기, 프로 24,900 / 프로젝트 무제한·저장공간 100GB·버전 기록 / 시작하기, 팀 49,000 / 멤버 10명·저장공간 1TB·권한 관리 / 문의하기. 1·3번 카드는 흰 배경에 회색 버튼, 가운데 카드는 뉴트럴 블랙(아주 약간 푸른 기)에 파란 버튼.\"],[\"트리거\",\"상단에서 '연간'을 탭할 때.\"],[\"반응\",\"금액이 7,900 / 19,900 / 39,000으로 감소. 숫자가 바뀌는 자릿수만 변하며, 금액이 올라갈 때는 숫자가 위로 굴러가며 바뀌고 내려갈 때는 반대 방향.\"],[\"수정\",\"· 숫자가 굴러갈 때 1씩 변하며 돌아가도록 수정\\n· 상단 월간/연간이 차지하는 공간의 균형 조정\\n· 버튼을 사각형에 모서리만 살짝 둥근 형태로 변경\"]]},\"49\":{\"t\":\"틸트 카드\",\"r\":[[\"오브젝트\",\"회색과, 회색에 아주 살짝 노란 기가 섞인 색의 그라데이션 배경을 가진 가로로 살짝 긴 사각형 카드. 중앙에 '기울어지는 카드' 텍스트.\"],[\"트리거\",\"카드에 마우스 커서를 올릴 때.\"],[\"반응\",\"커서가 올라간 부분이 뒤쪽으로 기울어짐.\"],[\"수정\",\"· 마우스가 카드 밖으로 나가면 초기 상태로 복귀\\n· 배경 전체에 톤을 더해 더 어둡게\"]]},\"50\":{\"t\":\"스크롤 스크럽\",\"r\":[[\"오브젝트\",\"범위 대부분을 채우는 흰색 사각형 카드. 카드 안 중앙과 왼쪽 사이에 모서리가 둥근 검정 정사각형 하나.\"],[\"트리거\",\"카드 안에서 스크롤할 때.\"],[\"반응\",\"정사각형이 왼쪽으로 굴러가며 중앙을 지나는 지점부터 원으로 변하기 시작해 반대편에 도달하면 완전한 원이 됨. 색도 중앙부터 서서히 빨강으로 변해 마지막에 완전한 빨강. 카드 오른쪽에는 스크롤 인디케이터가 함께 움직임.\"],[\"수정\",\"· 초기 사각형의 라운드 값을 더 주고, 바닥에서 굴러가는 느낌을 강화\"]]},\"51\":{\"t\":\"스크롤 스파이\",\"r\":[[\"오브젝트\",\"화면 중앙의 사각형 카드. 카드 안은 스크롤 가능하며 카드 3개 분량을 내려갈 수 있음. 3개 섹션이 있고 각 섹션 상단에 '소개 - 스크롤해보세요', '기능 - 왼쪽 목차를 보세요', '가격 - 표시가 따라옵니다'. 카드 왼쪽에는 회색 '소개', '기능', '가격'이 세로로 나열되고 '소개'에 검정 둥근 사각형 인디케이터.\"],[\"트리거\",\"카드를 스크롤해 새 섹션이 카드 중간보다 위로 올라올 때.\"],[\"반응\",\"왼쪽 인디케이터가 해당 섹션의 키워드로 이동. 반대 방향 스크롤에서도 동일하게 동작.\"]]},\"52\":{\"t\":\"한 자씩 조립\",\"r\":[[\"오브젝트\",\"스크롤 상자 안에 순서대로 '아래로 스크롤하세요 ↓'(작고 얇은 회색), 'Interaction', '스마트 인터랙션', 'Motion Design'(크고 굵은 볼드) 텍스트가 배치. 상자 전체 범위의 중앙에 하나의 텍스트만 보이도록 각 텍스트가 상자 높이만큼의 구간을 차지.\"],[\"트리거\",\"상자 안에서 스크롤할 때.\"],[\"반응\",\"두 번째 텍스트부터, 눈에 보이기 시작하는 시점에 가장 앞글자부터 아래에서 위로 올라오며 opacity가 올라가 한 글자씩 조립되는 듯한 효과.\"]]},\"53\":{\"t\":\"한 단어만 바뀌는 문장\",\"r\":[[\"오브젝트\",\"큰 사각형 상자 안에 3줄 텍스트 — 'STUDIO NOTE' / '우리는 가벼운 화면을 만듭니다' / '작은 팀이 천천히, 오래 다듬습니다.' 위아래 줄은 작고 얇은 회색, 가운데 줄은 크고 굵은 볼드. '가벼운'은 붉은 주황색이고 글자 아래 20% 정도를 형광펜으로 칠한 느낌의 효과.\"],[\"트리거\",\"시간이 지남에 따라.\"],[\"반응\",\"'가벼운'이 '솔직한' → '조용한' → '따뜻한' → '정확한' → '오래쓰는'으로 계속 바뀜. 기존 텍스트는 흐려지면서 위로 올라가고, 새 텍스트는 아래에서 올라오되 올라오는 동안 0.1초 만에 선명해짐. 텍스트별 유지 시간은 0.8초.\"]]},\"54\":{\"t\":\"글자 늘어남/굵기 출렁임\",\"r\":[[\"오브젝트\",\"검은 배경의 사각형 박스. 중앙에 아주 큰 'FLEX' 텍스트(Medium), 그 아래에 작고 얇은 회색 텍스트 '커서를 좌우로 움직여 보세요'.\"],[\"트리거\",\"상자 안에서 커서를 좌우로 움직일 때.\"],[\"반응\",\"커서가 오른쪽으로 갈수록 FLEX의 좌우 폭이 늘어나고 굵기가 Black까지 두꺼워지며, 왼쪽으로 갈수록 좌우 폭이 줄어들고 Thin까지 얇아짐. 커서가 상자 밖으로 나가면 그 상태를 유지.\"]]},\"55\":{\"t\":\"틀을 넘치는 큰 글자\",\"r\":[[\"오브젝트\",\"큰 스크롤 사각형 카드 안에, 오른쪽으로 약 8도 기울어진 검은색 직사각형 틀. 그 중앙에 같은 각도로 기울어진 '가득' 텍스트(붉은 주황색)가 틀 내부의 약 70%를 차지하는 크기로 배치.\"],[\"트리거\",\"카드 안에서 아래로 스크롤할 때.\"],[\"반응\",\"'가득' 텍스트가 점점 커져 틀의 150%를 넘는 크기까지 커짐. 텍스트는 틀을 벗어날 수 있지만, 카드 바깥으로 넘치는 부분은 잘려서 보이지 않음.\"]]},\"56\":{\"t\":\"흩어졌다 모이는 글자\",\"r\":[[\"오브젝트\",\"큰 검은색 상자 안에 '타이포그래피' 텍스트가 꽤 크게 배치. 글자 색은 살짝 붉은 계열의 노란색과 연한 회색이 번갈아 칠해짐. 텍스트 아래에 얇은 회색 텍스트로 '클릭해보세요'.\"],[\"트리거\",\"글자를 탭했을 때.\"],[\"반응\",\"앞 글자부터 0.1초 간격으로 각 글자가 랜덤한 다른 자리로 날아감. 그 자리에 1.5초 이상 머문 뒤, 0.05초 간격으로 거의 한 번에 원래 자리로 날아서 돌아옴.\"]]},\"57\":{\"t\":\"원을 도는 글자 띠\",\"r\":[[\"오브젝트\",\"큰 검은색 상자 안에 3겹의 원형 텍스트 띠. 가장 바깥은 '✦ SMART INTERACTION DESIGN'이 4번 반복(흰색), 중간은 '∙ 스마트 인터랙션 디자인 '이 5번 반복(주황색), 가장 안쪽은 ' ∙ MOTION ∙ TYPE ∙ RHYTHM '이 3번 반복(보라색). 바깥쪽부터 폰트 사이즈가 서서히 작아지고, 중심에는 주황색 작은 원.\"],[\"트리거\",\"상자 안에서 스크롤할 때.\"],[\"반응\",\"내릴수록 바깥쪽과 안쪽 텍스트 띠는 시계 방향으로, 중간 텍스트 띠는 반시계 방향으로 회전.\"],[\"조건\",\"스크롤 인디케이터를 함께 표시하고, 스크롤 범위를 넉넉하게 둠.\"]]},\"58\":{\"t\":\"먹물 번짐\",\"r\":[[\"오브젝트\",\"큰 사각형 화면, 한지 같은 느낌의 배경 적용, 가운데에는 얇은 회색 텍스트 '클릭해보세요'.\"],[\"트리거\",\"화면을 탭하면.\"],[\"반응\",\"'사람 인' '큰 대' '뫼 산' '나무 목' '물 수'가 탭할 때마다 차례대로 나오는데, 텍스트로 출력하지 말고 각 한자를 실제 한자처럼 그림으로 출력. 출력 방식은 각 한자를 쓰는 획순을 고려하여 그려지도록 하고, 그려질 때 획이 그어진 곳 주변으로 먹물이 번지는 효과 적용. 2초 뒤 번짐 효과는 사라짐.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"59\":{\"t\":\"깨졌다 복구되는 글자\",\"r\":[[\"오브젝트\",\"큰 검은색 상자 내에 중앙에 크고 굵은 텍스트 'GLITCH' 배치, 그 하단에는 얇고 작은 회색으로 '텍스트 위에 커서를 올리면 0.4초 동안 글리치가 발생합니다' 배치.\"],[\"트리거\",\"텍스트 위에 커서를 올리면.\"],[\"반응\",\"빨간색과 파란색이 포함된 글리치가 0.4초 동안 랜덤하게 텍스트에 적용되게 함.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"60\":{\"t\":\"알약 하나의 UI 변신\",\"r\":[[\"오브젝트\",\"회색 큰 사각형 카드 중앙에 검은색 알약 모양이 있고, 내부에는 흰색 점 3개 배치. 화면 하단에는 얇고 작은 회색으로 '상태: 알약 · 누를 때마다 플레이어 → 볼륨바 → 토글 → 차트 카드 → 알약' 텍스트 배치, 상태 뒤 알약에만 검은색 볼드 처리.\"],[\"트리거\",\"알약을 탭하면.\"],[\"반응\",\"알약이 음악 플레이어 모양으로 변하는데, 검은색 알약이 커지면서 플레이어 사각형 카드 모양으로 바뀌고, 그 다음에는 볼륨 슬라이더 바 모양, 그 다음에는 방해 금지 토글 카드, 그 다음에는 이번 주 걸음 수 그래프 차트 출력, 마지막으로 다시 알약으로 돌아옴.\"],[\"조건\",\"모든 UI가 흑백으로 출력, 볼륨바와 토글 카드는 양쪽이 반원 라운딩임.\"],[\"변수\",\"\"]]},\"61\":{\"t\":\"도형 모핑\",\"r\":[[\"오브젝트\",\"화면 중앙에 큰 파란색 원(희미한 그림자 그라데이션 들어감) 배치, 파란색 원 아래에는 좀 띄워서 표면 그림자 배치.\"],[\"트리거\",\"원을 탭하면.\"],[\"반응\",\"원이 비슷한 사이즈의 사각형으로 바뀌고, 다시 탭하면 별로 바뀌고, 다시 탭하면 원으로 돌아옴. 탭할 때마다 45도씩 회전하면서 바뀌게 하고, 바뀔 때는 모핑 방식으로 바뀜.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"62\":{\"t\":\"말랑한 덩어리\",\"r\":[[\"오브젝트\",\"검은색 사각형 카드 중앙에 주황색 원이 있는데, 유체처럼 꿀렁거림. 커서에도 주황색 원이 더 작게 달려 있음.\"],[\"트리거\",\"커서를 움직일 때.\"],[\"반응\",\"커서가 가운데 원에 다가가면 쫀득하게 달라붙음. 커서를 원 바깥으로 가져가면 일정 범위까지는 달라붙어있다가 결국 떨어져 나감. 원에서 커서가 붙고 떨어져나갈 때 유체 바운싱 효과가 있고, 커서 움직이는 속도에 따라 커서에 붙은 원도 유체처럼 움직임.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"63\":{\"t\":\"점이 모여 모양\",\"r\":[[\"오브젝트\",\"검은색 큰 스크롤 상자 안에 옅은 하늘색 점들이 랜덤한 크기로 화면 전체에 흩뿌려져 있음. 왼쪽에는 '00 흩어진 상태' 텍스트 배치.\"],[\"트리거\",\"상자 스크롤 하면.\"],[\"반응\",\"왼쪽 텍스트가 올라가면서 '01 손' '02 별' '03 로고' '04 다시 흩어짐' 순서대로 바뀌게 되고, 각 텍스트가 올라옴에 따라서 점들이 모여 손 모양, 별 모양, 원 테두리 안에 알파벳 SI라고 쓰여진 로고 모양, 다시 흩어진 모양으로 바뀌게 됨.\"],[\"조건\",\"마우스 커서가 점들 위로 움직일 때 커서 주변 20px 안의 점들은 주변으로 밀려나게 됨. 상자 오른쪽에 스크롤 인디케이터 배치, 인디케이터는 흰색.\"],[\"변수\",\"점들의 크기 범위 - 지름 2-5px 사이\"]]},\"64\":{\"t\":\"점 격자 물결\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 내에 회색 점들이 격자 형태로 배치되어 있음. (점간 간격 약 15px 정도)\"],[\"트리거\",\"카드를 탭하면.\"],[\"반응\",\"탭한 위치 기준으로 주변 3열 정도의 점들이 3번 점멸하고, 점멸 효과가 물결처럼 다른 점들을 타고 카드 끝까지 퍼져나감.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"65\":{\"t\":\"솟아오르는 블록 바닥\",\"r\":[[\"오브젝트\",\"범위 내에 입체 front quarter뷰로 보이는 사각형 바닥이 있고, 바닥은 흰색 선으로 격자 형태로 촘촘하게 나눠져 있음. 바닥은 살짝 두께감이 있고 회색.\"],[\"트리거\",\"바닥 타일 위에 마우스를 올리면.\"],[\"반응\",\"타일이 기둥 형태로 위로 올라오게 됨.\"],[\"조건\",\"마우스가 가만히 타일 위에 머물 때는 올라간 타일만 최대 높이로 올라와 있고, 나머지는 낮은 수준에서 계속해서 물결치는데, 타일 끝으로 갈수록 물결치는 정도가 약해짐. 마우스가 움직일 때는 주변 4*4 정도의 타일이 최대까지 올라갔다가 내려오며, 내려오는 효과에도 마찬가지로 물결 효과가 있음. 각 기둥은 최대 높이로 올라갈수록 파란색이 됨.\"],[\"변수\",\"\"]]},\"66\":{\"t\":\"산 정상 오르기\",\"r\":[[\"오브젝트\",\"큰 사각형 상자 안에 중앙에 높은 산 그림을 그려주고, 뒤쪽엔 다른 산들과 하늘, 해 배경이 있음. 산에는 조금의 나무가 배치되어 있고, 정상에는 눈이 쌓여 있음. 산 아래서부터 정상까지 꼬불꼬불한 점선 경로가 배치되어 있고, 경로 맨 아래에는 주황색 테두리와 Glow 이펙트가 적용된 흰 원이 있음.\"],[\"트리거\",\"상자 안에서 스크롤 하면.\"],[\"반응\",\"스크롤에 따라 원이 점선을 따라 이동하면서 점선이 주황색 실선으로 채워짐. 정상에 도착하면 주황색 깃발이 꽂힘.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"67\":{\"t\":\"펜으로 그려 나가기\",\"r\":[[\"오브젝트\",\"큰 스크롤 상자 중앙에 '아래로 스크롤하면 그림이 시작됩니다 🡫' 작은 회색 텍스트가 있고, 우측에는 스크롤 바 인디케이터가 있음.\"],[\"트리거\",\"스크롤하면.\"],[\"반응\",\"텍스트는 스크롤되어 올라가고, 갑자기 연필이 나타나 헤드폰 모양의 그림을 그림. 그림은 스크롤에 따라 그려지는 것이 아니라, 상자 중간까지 스크롤하면 알아서 쭉 그려짐. 그림을 다 그리고 나면 안쪽이 색상으로 채워지면서 그림이 완성되고, 그림 아래 '완성!' 텍스트 출력.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"68\":{\"t\":\"지도에 경로 긋기\",\"r\":[[\"오브젝트\",\"큰 사각형 스크롤 카드 생성, 중간에 '스크롤해 보세요' 텍스트와 아래로 왔다갔다하는 아래쪽 화살표 배치, 얇은 회색으로.\"],[\"트리거\",\"스크롤 하면.\"],[\"반응\",\"카드 내부에 큰 하늘색 사각형 카드 나타나고, 하늘색 카드 안에 플랫디자인 대한민국 지도 있음. 하늘색 카드가 절반 정도 보이는 지점에서 서울, 대전, 광주, 대구, 부산 위치에 주황색 핀이 내려와 꽂히고, 핀 밑에는 그림자, 핀 옆에 각 지역 이름 적힘. 순서대로 내려와야 하고, 다 내려오면 다시 순서대로 파란색 실선으로 경로를 이어줌.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"69\":{\"t\":\"차트가 자란다\",\"r\":[[\"오브젝트\",\"큰 스크롤 상자가 있고 위와 같은 스크롤 문구 있음. ('스크롤해 보세요' 텍스트와 아래로 왔다갔다하는 아래쪽 화살표, 얇은 회색)\"],[\"트리거\",\"스크롤 하면.\"],[\"반응\",\"파란색으로 되어 있는 요일별 막대 그래프 차트와 원형 바가 아래에서 올라오고, 일정 수준 올라왔을 때 ease out으로 막대와 바가 올라오거나 차게 됨. 원형 바 안에는 퍼센티지도 기입.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"70\":{\"t\":\"연도가 넘어가는 타임라인\",\"r\":[[\"오브젝트\",\"스크롤 카드 생성 후, 중앙에 엄청 크게 '1996'이라고 써 있고, 그 아래엔 5단계로 나뉘어진 타임라인 선 존재, 첫 번째 점만 주황색으로 칠해져 있음. 카드 하단에는 스크롤 안내 문구. 타임라인 밑에는 단계별로 1996 2004 2015 2019 2026이 쓰여져 있음.\"],[\"트리거\",\"스크롤 하면.\"],[\"반응\",\"스크롤 위치에 따라 5단계(1996 → 2004 → 2015 → 2019 → 2026) 중 가까운 단계로 넘어감. 중앙의 큰 연도 숫자는 자릿수별로 세로로 굴러가듯(주행거리계처럼) ease-out으로 다음 연도로 바뀜. 타임라인에서는 지나온 구간의 선이 주황색으로 채워지고, 지나온 점도 주황색으로 바뀜. 현재 단계의 점은 살짝 커지고, 해당 연도 라벨만 검정 볼드로 강조됨. 위로 스크롤하면 반대로 되돌아감.\"],[\"조건\",\"\"],[\"변수\",\"\"]]},\"71\":{\"t\":\"공 떨어뜨리기\",\"r\":[[\"오브젝트\",\"베이지색 큰 사각형 카드 하단에 바닥(조금 진한 베이지 띠)이 있고, 상단 중앙에는 빨간색 원(공) 하나가 떠 있음. 카드 상단에 작은 회색 글씨로 '눌러 보세요' 배치.\"],[\"트리거\",\"카드를 탭하면.\"],[\"반응\",\"공이 중력으로 떨어지다가 바닥에 닿는 순간 위아래로 납작하게 찌그러지면서(가로로 퍼짐) 튀어 오르고, 튈 때마다 높이가 줄어들며 여러 번 반복하다가 바닥에서 멈춤. 떨어지는 동안에는 속도에 따라 세로로 살짝 길어지고, 공 아래 그림자는 높이에 따라 작아졌다 커짐. 다시 탭하면 처음 위치에서 다시 떨어짐.\"],[\"조건\",\"튀어오를 때마다 높이는 약 56%로 줄어듦. 충격 속도가 클수록 더 많이 찌그러짐.\"],[\"변수\",\"중력 세기 600-3000px/s², 튀어오르는 높이 비율 20-90% 범위로 조절 가능 (기본값: 1500px/s², 56%)\"]]},\"72\":{\"t\":\"쏟아져 쌓이는 알갱이\",\"r\":[[\"오브젝트\",\"베이지색 큰 사각형 카드 하단에 두 개의 기둥이 받치고 있는 기울어진 갈색 판자가 있음(픽셀 느낌). 상단 중앙에 작은 회색 '눌러 보세요' 텍스트, 우측 상단에는 흰색 원형 초기화 버튼 배치.\"],[\"트리거\",\"카드를 꾹 누르고 있으면(커서 위치 기준).\"],[\"반응\",\"누르고 있는 동안 커서 x 위치 위쪽에서 모래 알갱이들이 계속 쏟아져 내려와 판자 위에 쌓임. 알갱이는 쌓이다가 경사를 따라 흘러내려 아래쪽으로 퍼지고, 판자 끝을 넘어가면 아래로 떨어져 사라짐. 손을 떼면 쏟아짐이 멈추고 쌓인 모래는 그대로 유지됨. 초기화 버튼을 누르면 모래가 모두 사라짐.\"],[\"조건\",\"알갱이는 3px 크기의 사각형(픽셀 느낌), 초당 약 150개 생성.\"],[\"변수\",\"초당 알갱이 수 40-300개, 쏟아지는 폭 0-40px, 중력 세기 300-1500px/s² 범위로 조절 가능 (기본값: 150개, 14px, 800px/s²)\"]]},\"73\":{\"t\":\"부딪혀 무너짐\",\"r\":[[\"오브젝트\",\"베이지색 큰 사각형 카드 하단에 바닥 띠가 있고, 왼쪽에는 작은 검은색 대포, 오른쪽에는 빨간 벽돌이 엇갈려 쌓인 벽이 있음. 상단 중앙에 작은 회색 '눌러 보세요' 텍스트, 우측 상단에 흰색 원형 초기화 버튼 배치.\"],[\"트리거\",\"카드 위에서 커서를 움직이면 / 카드를 탭하면.\"],[\"반응\",\"커서를 움직이면 대포의 포신이 커서 방향으로 돌아가고, 포탄이 날아갈 궤적이 점선으로 미리 보임. 탭하면 포신이 향한 각도로 포탄이 발사되어 포물선을 그리며 날아가 벽돌 벽에 부딪힘. 포탄이 맞은 위치에 따라 벽이 다르게 무너지는데, 윗부분을 맞히면 위쪽 벽돌만 튕겨 나가고, 아랫부분을 맞히면 받침을 잃은 위쪽 벽돌들이 모두 주저앉음. 부딪힌 벽돌들은 회전하며 튕겨 나가 바닥에서 몇 번 튕기다 멈춤. 초기화 버튼을 누르면 벽이 처음 모습으로 다시 쌓임.\"],[\"조건\",\"포탄이 날아가는 동안에는 다시 발사되지 않음. 포신 각도는 위로 약 70°, 아래로 약 9°까지만 움직임. 충격 반경(약 46px) 안의 벽돌이 포탄 진행 방향으로 튕겨 나가고 가까울수록 더 멀리 날아감.\"],[\"변수\",\"포탄 속도 300-900px/s, 충격 반경 20-90px 범위로 조절 가능 (기본값: 600px/s, 46px)\"]]},\"74\":{\"t\":\"빛 번짐\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 안에 어두운 남색 둥근 사각형 타일 3개('빛', 'Hover', '인터랙션')를 위 2개, 아래 중앙 1개 형태로 배치. 글씨는 크고 굵은 흰색.\"],[\"트리거\",\"타일 위에 커서를 올리면.\"],[\"반응\",\"커서가 올라간 타일의 정중앙에서 따뜻한 노란 빛이 퍼져 나와 타일 안쪽이 환하게 밝아지고, 타일 바깥으로도 빛이 번지며 테두리와 글자가 함께 빛남. 다른 타일은 그대로 어두움. 커서가 타일에서 벗어나면 빛이 부드럽게 꺼지고, 다른 타일로 옮기면 그 타일의 중심에서 빛이 켜짐.\"],[\"조건\",\"빛은 커서 위치가 아니라 항상 타일의 중심에서 나옴. 켜지고 꺼지는 데 약 0.45초.\"],[\"변수\",\"빛 번짐 크기 10-80px, 빛 밝기 10-90% 범위로 조절 가능 (기본값: 34px, 45%)\"]]},\"75\":{\"t\":\"네온 선\",\"r\":[[\"오브젝트\",\"짙은 남색 큰 사각형 카드 가운데를 가로로 가로지르며 물결치는 네온 선 여러 가닥(하늘색~흰색, 글로우 효과 적용)이 겹쳐 있음. 선들은 가만히 있어도 천천히 흐르듯 움직임.\"],[\"트리거\",\"카드 위에서 커서를 위아래로 움직이면.\"],[\"반응\",\"커서가 카드 맨 위에 있을 때 파동의 폭(높낮이)이 가장 크고, 아래로 내려갈수록 폭이 점점 줄어들어 맨 아래에서는 거의 직선에 가깝게 잔잔해짐. 커서를 위아래로 움직이는 대로 파동의 폭이 부드럽게 따라 변하고, 커서가 카드 밖으로 나가면 기본 폭으로 돌아감.\"],[\"조건\",\"커서의 좌우 위치는 영향을 주지 않고 상하 위치만 파동 폭에 반영됨.\"],[\"변수\",\"최대 파장 폭 배율 1-4배, 따라가는 속도 1-12, 흐르는 속도 20-300% 범위로 조절 가능 (기본값: 2.6배, 5, 100%)\"]]},\"76\":{\"t\":\"유리 굴절\",\"r\":[[\"오브젝트\",\"대각선 줄무늬(노랑·청록·남색·빨강)가 넓게 깔린 큰 사각형 카드 위에 투명한 유리구슬(원형 렌즈)이 놓여 있음. 하단 왼쪽에 작은 흰색 알약 안내 '커서를 움직여 보세요 · 유리 안 배율 1.4배'.\"],[\"트리거\",\"카드 위에서 커서를 움직이면.\"],[\"반응\",\"유리구슬이 커서를 부드럽게 따라 움직이고, 구슬 안에 비치는 줄무늬는 1.4배로 확대되어 굴절된 것처럼 휘어 보임. 구슬 테두리에는 흰색 하이라이트와 곡면 반사광이 있음.\"],[\"조건\",\"커서와 구슬 중심 사이는 ease-out으로 따라옴.\"],[\"변수\",\"렌즈 반지름 30-100px, 확대 배율 110-220%, 따라오는 속도 3-30 범위로 조절 가능 (기본값: 62px, 140%, 12)\"]]},\"77\":{\"t\":\"크롬 광택\",\"r\":[[\"오브젝트\",\"검은 회색 큰 사각형 카드 중앙에 금속 질감의 큰 굵은 글씨 'CHROME'이 있고, 그 왼쪽에는 크롬 구슬(은색 구)이 있음. 하단에 작은 회색 안내 문구 '커서를 움직여 보세요'.\"],[\"트리거\",\"카드 위에서 커서를 움직이면.\"],[\"반응\",\"커서 위치에 따라 글씨 표면의 은빛 반사 띠가 좌우로 미끄러지듯 이동하고, 구슬 표면의 하이라이트와 반사 방향도 커서 쪽으로 따라 움직여 금속이 빛을 받는 각도가 바뀌는 느낌을 줌. 커서가 카드 밖으로 나가면 처음 각도로 천천히 돌아옴.\"],[\"조건\",\"반사 이동은 ease-out으로 부드럽게 따라옴.\"],[\"변수\",\"반응 속도 2-20, 광택 강도 10-100% 범위로 조절 가능 (기본값: 7, 60%)\"]]},\"78\":{\"t\":\"잉크 얼룩 번짐\",\"r\":[[\"오브젝트\",\"한지/종이 느낌의 아이보리 큰 사각형 카드. 가운데에 작은 회색 안내 '화면을 눌러 보세요'.\"],[\"트리거\",\"카드를 누르면(누른 채 드래그해도).\"],[\"반응\",\"누른 자리에 먹물 한 방울이 떨어져 번지며 퍼짐. 처음에는 작은 점에서 빠르게 커지다가 서서히 느려지고, 가장자리는 번진 것처럼 흐릿하게 퍼지며 주변에 작은 번짐이 뒤따라 생김. 시간이 지나면 먹물이 종이에 스며들듯 천천히 옅어져 사라짐. 누른 채 드래그하면 일정 간격으로 작은 먹물이 이어서 떨어짐.\"],[\"조건\",\"번짐이 사라지는 데 약 6초.\"],[\"변수\",\"번지는 시간 2000-12000ms, 큰 방울 크기 16-60px, 드래그 방울 간격 10-80px 범위로 조절 가능 (기본값: 6500ms, 34px, 34px)\"]]},\"79\":{\"t\":\"연기와 불꽃\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 하단 중앙에 장작이 쌓인 모닥불이 있음. 평소에는 불꽃이 작게 일렁이고 연기도 거의 나지 않음. 상단에는 작은 회색 안내 '불에 커서를 가까이 가져가 보세요'.\"],[\"트리거\",\"커서를 불이 있는 부분 위로 가져가면.\"],[\"반응\",\"불꽃이 높고 크게 커지면서 더 빠르게 위로 타오르고 불빛이 주변으로 더 넓게 퍼지며, 회색 연기가 훨씬 많이, 더 높이 피어오름. 커서를 불에서 떼면 불꽃은 다시 작게 잦아들고 연기도 거의 사라짐.\"],[\"조건\",\"불 주변 약 95×80px 범위가 반응 영역이며, 불꽃이 커지고 작아지는 변화는 부드럽게(약 0.3초) 이어짐.\"],[\"변수\",\"평소 불꽃 양 10-80, 커졌을 때 추가 불꽃 30-200, 연기 양 30-250% 범위로 조절 가능 (기본값: 34, 100, 100%)\"]]},\"80\":{\"t\":\"하늘 색이 바뀌는 하루\",\"r\":[[\"오브젝트\",\"큰 스크롤 카드 안에 하늘 배경과 도시 건물 실루엣(뒤 건물 연하게, 앞 건물 진하게)이 있고 건물에는 창문이 나 있음. 하늘에는 해가 떠 있고 좌측 상단에는 시간대 이름표가 있으며 우측에는 스크롤 인디케이터 표시.\"],[\"트리거\",\"카드 안에서 스크롤하면.\"],[\"반응\",\"스크롤 위치에 따라 하늘색이 새벽(분홍·푸른 보라) → 낮(파랑) → 저녁(자주·주황) → 밤(남색·보라)으로 부드럽게 변함. 해는 왼쪽 아래에서 포물선을 그리며 지다가 사라지고, 밤이 되면 달과 별이 나타남. 건물 색은 시간대에 맞춰 어두워지고, 해가 진 뒤에는 건물 창문들이 하나씩 노란 불로 켜짐. 시간대 이름표 글자도 함께 바뀜. 위로 스크롤하면 반대로 되돌아감.\"],[\"조건\",\"창문은 스크롤 62% 이후부터 켜지기 시작해 92%에서 거의 모두 켜짐.\"],[\"변수\",\"별 밝기 20-100%, 창문 불빛 켜지는 시점 40-85% 범위로 조절 가능 (기본값: 100%, 62%)\"]]},\"81\":{\"t\":\"무한 줌\",\"r\":[[\"오브젝트\",\"큰 스크롤 카드 안에 미술관 장면이 있고 중앙에는 큰 액자가 걸려 있음(액자 안에 다음 장면이 작게 보임). 이어지는 장면은 미술관 → 옥외 광고판 → 거실 TV → 사무실 모니터 → 책상 위 사진 액자 총 5개이며, 각 장면마다 중앙의 화면 안에 다음 장면이 들어 있음. 좌측 상단에 현재 장면 이름표('1 / 5 미술관'), 우측에 5개의 점 인디케이터와 스크롤 인디케이터 배치.\"],[\"트리거\",\"카드 안에서 스크롤하면.\"],[\"반응\",\"스크롤에 따라 카메라가 중앙의 액자(화면) 속으로 계속 확대되며 빨려 들어가고, 액자가 화면을 가득 채우는 순간 그 안에 있던 다음 장면이 원래 크기로 펼쳐짐. 이 과정이 5번째 장면까지 끊김 없이 이어지고, 이름표와 점 인디케이터가 장면에 맞춰 바뀜. 위로 스크롤하면 반대로 다시 빠져나옴.\"],[\"조건\",\"각 장면의 화면은 한 변이 카드의 약 1/2.8 크기이며, 다음 장면은 그 크기에 정확히 맞게 들어 있어 확대되었을 때 이음새 없이 이어짐.\"],[\"변수\",\"장면 하나당 스크롤 거리 150-260px 범위로 조절 가능 (기본값: 260px)\"]]},\"82\":{\"t\":\"빛줄기 터널 비행\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 중앙에서 사방으로 흩어지듯 빛줄기(흰색·연한 파란색 별빛)들이 천천히 뻗어 나오는 우주 터널. 하단에 작은 회색 안내 '꾹 누르고 있으면 가속합니다'.\"],[\"트리거\",\"카드를 꾹 누르고 있으면.\"],[\"반응\",\"누르고 있는 동안 빛줄기들이 점점 빨라지며 길게 늘어나 중앙에서 바깥으로 쏟아지듯 날아가고, 중앙에는 아주 옅은 푸른 빛만 살짝 번짐(번짐은 작게 유지). 손을 떼면 속도가 서서히 줄어 처음의 느린 흐름으로 돌아옴.\"],[\"조건\",\"속도 변화는 ease-out으로 부드럽게 이어짐.\"],[\"변수\",\"가속 최고 속도 6-30 범위로 조절 가능 (기본값: 15)\"]]},\"83\":{\"t\":\"물체 회전 전시\",\"r\":[[\"오브젝트\",\"밝은 베이지 배경의 큰 사각형 카드 중앙에 진회색 원통형 제품(세로 홈이 파인 스피커 느낌, 한쪽 면에 주황색 불빛 띠와 작은 흰색 버튼)이 흰색 받침 위에 놓여 있음. 원통의 윗면·아랫면 곡선과 받침의 타원은 같은 시점(원근)으로 그려져 자연스럽게 맞물림. 하단에 작은 회색 안내 문구.\"],[\"트리거\",\"제품을 좌우로 드래그하면. 아무것도 하지 않을 때도.\"],[\"반응\",\"아무것도 하지 않을 때는 제품이 한 방향으로 천천히 혼자 회전함. 드래그하면 드래그한 만큼 회전하며 세로 홈의 음영과 주황 불빛 띠, 흰색 버튼이 원통 표면을 따라 이동하고 뒤로 넘어가면 가려짐. 손을 떼면 던진 속도로 관성 회전을 하다가 서서히 원래의 느린 자동 회전 속도로 돌아옴. 마우스를 잡으면 손바닥 커서(grab)로 바뀜.\"],[\"조건\",\"빛은 항상 같은 방향에서 오기 때문에 정면을 향한 면이 가장 밝고 옆면으로 갈수록 어두워짐. 자동 회전 속도는 초당 약 0.45rad.\"],[\"변수\",\"자동 회전 속도 -100-100, 드래그 감도 6-40, 회전 복귀 속도 3-40 범위로 조절 가능 (기본값: 45, 16, 11)\"]]},\"84\":{\"t\":\"분해도\",\"r\":[[\"오브젝트\",\"베이지색 큰 스크롤 카드 중앙에 작은 전자 제품이 위에서부터 상단 커버(검정) → 메인 보드(초록) → 배터리 팩(회색) → 하단 베이스(검정) 순으로 층층이 합쳐진 상태로 있음. 합쳐졌을 때 네 부품의 좌우 폭과 윤곽선이 정확히 맞아 떨어져 하나의 매끈한 물체처럼 보임(위·아래 끝만 둥글게). 카드 상단에 작은 회색 안내 '아래로 스크롤하면 분해, 위로 올리면 다시 합쳐집니다', 하단에 '분해 0%' 텍스트, 우측에 스크롤 인디케이터 배치.\"],[\"트리거\",\"카드 안에서 스크롤하면.\"],[\"반응\",\"스크롤을 내리는 만큼 각 부품이 위·아래로 벌어지며(위쪽 부품은 위로, 아래쪽 부품은 아래로) 분해도 형태로 펼쳐지고, 펼쳐지면서 각 부품 오른쪽에 부품 이름과 설명 라벨('상단 커버 · ABS 하우징', '메인 보드 · 제어 회로', '배터리 팩 · 2셀 리튬이온', '하단 베이스 · 고무 발판')이 부품을 따라 나타남. 하단 퍼센트가 분해 정도에 맞춰 0~100%로 바뀜. 위로 스크롤하면 다시 하나로 합쳐짐.\"],[\"조건\",\"부품 이동은 시작과 끝에서 느려지는 ease in-out 곡선, 라벨은 분해 35% 이후부터 나타남.\"],[\"변수\",\"벌어지는 간격 20-90px, 라벨 나타나는 시점 0-80% 범위로 조절 가능 (기본값: 50px, 35%)\"]]},\"85\":{\"t\":\"스크롤로 걷는 실내\",\"r\":[[\"오브젝트\",\"연한 아이보리 큰 스크롤 카드 안에 얇은 선으로만 그린 실내 투시도가 있음. 장면은 복도 → 계단 → 방 순서이며, 복도와 계단은 중앙의 소실점 쪽에 다음 공간으로 이어지는 열린 입구가 있음. 우측 상단에는 현재 위치를 알려주는 작은 흰색 카드('01 복도'), 하단에 '스크롤해 보세요' 안내, 우측에 스크롤 인디케이터 배치.\"],[\"트리거\",\"카드 안에서 스크롤하면.\"],[\"반응\",\"스크롤하는 만큼 시점이 중앙 소실점을 향해 앞으로 걸어 들어가는 것처럼 확대되고, 입구를 지나는 순간 다음 공간(복도 → 계단 → 방)이 이어서 펼쳐짐. 우측 상단 카드의 이름('01 복도' → '02 계단' → '03 방')이 해당 공간에 들어서면 바뀜. 위로 스크롤하면 뒤로 걸어 나옴.\"],[\"조건\",\"공간 전환은 입구 크기와 다음 장면의 크기가 정확히 맞물려 끊김 없이 이어짐.\"],[\"변수\",\"장면 하나당 스크롤 거리 150-260px 범위로 조절 가능 (기본값: 260px)\"]]},\"86\":{\"t\":\"유리구슬 속 장면\",\"r\":[[\"오브젝트\",\"짙은 남색 큰 사각형 카드 중앙에 유리구슬(스노우볼)이 나무 받침 위에 놓여 있음. 구슬 안에는 눈 덮인 바닥, 빨간 집, 초록 나무들, 쌓여 있는 하얀 눈송이들이 있음. 하단에 작은 회색 안내 '구슬을 잡고 흔들어 보세요'.\"],[\"트리거\",\"구슬을 잡고 드래그해서 흔들면.\"],[\"반응\",\"구슬이 드래그 방향으로 살짝 끌려가고, 구슬 안에 쌓여 있던 눈송이들이 한꺼번에 떠올라 소용돌이치듯 흩날림. 손을 떼면 구슬은 원래 자리로 돌아오고, 눈송이들은 천천히 흔들리며 내려와 다시 바닥에 쌓임. 흔들 때마다 속도가 클수록 더 세게 흩날림.\"],[\"조건\",\"눈송이는 구슬 유리벽 안쪽에서만 움직이고 벽에 닿으면 튕겨 나옴.\"],[\"변수\",\"눈송이 중력 5-80, 흔드는 세기 30-250%, 공기 저항 10-80% 범위로 조절 가능 (기본값: 26, 100%, 35%)\"]]},\"87\":{\"t\":\"글자 속 사진\",\"r\":[[\"오브젝트\",\"베이지색 큰 스크롤 카드. 처음에는 카드 안이 비어 있고 작은 회색 안내 '아래로 스크롤해 보세요'만 있음. 카드 바로 아래쪽에 'OCEAN / DRIFT / LIGHT / WAVES' 네 줄의 크고 굵은 글씨가 대기하고 있으며, 글씨 안쪽은 바다 위로 해가 지는 노을 사진(보라-분홍-주황 하늘, 해, 바다)으로 채워져 있음. 우측에 스크롤 인디케이터 배치.\"],[\"트리거\",\"카드 안에서 스크롤하면.\"],[\"반응\",\"스크롤하면 글자 덩어리가 카드 하단에서부터 위로 올라오며 지나가고, 글자 안에 채워진 사진은 글자보다 느린 속도(약 40%)로 같은 방향으로 따라 움직임. 그래서 글자가 올라올수록 글자 모양 안에 비치는 사진이 바다에서 수평선, 노을 하늘 순서로 천천히 바뀌어 보임. 위로 스크롤하면 반대로 움직임.\"],[\"조건\",\"글자 속도 대비 사진 속도는 0.4배(시차 효과). 사진은 글자 모양으로만 보이고 글자 바깥은 카드 배경색 그대로임.\"],[\"변수\",\"배경이 따라가는 비율 0-100%, 안내 문구 사라지는 거리 20-200px 범위로 조절 가능 (기본값: 40%, 80px)\"]]},\"88\":{\"t\":\"색 판이 덮는 전환\",\"r\":[[\"오브젝트\",\"주황색으로 가득 찬 큰 사각형 카드 좌측 하단에 큰 굵은 흰색 글씨('Orange'), 좌측 상단에 '01 / 04' 작은 텍스트, 우측 하단에는 흰색 '다음 →' 알약 버튼 배치.\"],[\"트리거\",\"'다음 →' 버튼을 탭하면.\"],[\"반응\",\"오른쪽에서 어두운 색 판이 먼저 밀려 들어와 화면을 덮고, 살짝 늦게 다음 색 판(민트 → 네이비 → 노랑 → 다시 주황 순)이 같은 방향으로 뒤따라 들어와 완전히 덮음. 새 판에는 해당 번호와 이름이 쓰여 있고, 버튼 색도 판 색에 맞춰 바뀜. 전환 중에는 버튼을 눌러도 반응하지 않음.\"],[\"조건\",\"판은 시작과 끝이 느리고 중간이 빠른 ease in-out(0.76초), 두 판 사이 간격은 0.13초.\"],[\"변수\",\"전환 시간 300-1600ms, 두 번째 판 지연 0-400ms 범위로 조절 가능 (기본값: 760ms, 130ms)\"]]},\"89\":{\"t\":\"페이지 넘김\",\"r\":[[\"오브젝트\",\"회갈색 큰 사각형 카드 중앙에 잡지처럼 펼쳐진 두 쪽짜리 책이 놓여 있음(왼쪽 '작은 도시 산책' 청록색 표지 면, 오른쪽 해 그림이 있는 아이보리 면). 총 3개의 펼침면이 있고, 하단에 작은 안내 문구 배치.\"],[\"트리거\",\"오른쪽 페이지를 잡고 왼쪽으로 드래그하면(앞으로 넘기기), 왼쪽 페이지를 잡고 오른쪽으로 드래그하면(뒤로 넘기기). 탭해도 동작.\"],[\"반응\",\"잡은 페이지 한 장이 책등을 축으로 입체적으로 들려 올라가며 넘어가고, 넘어가는 동안 종이 면이 점점 어두워졌다가 뒷면(다음 펼침면의 왼쪽 면 또는 이전 펼침면의 오른쪽 면)이 나타남. 페이지가 들린 자리 아래에는 다음 펼침면의 오른쪽(또는 이전 펼침면의 왼쪽) 페이지가 드러남. 일정 정도 이상 넘기고 손을 떼면 끝까지 넘어가 새 펼침면이 되고, 덜 넘겼으면 원래대로 되돌아감. 마지막 펼침면에서 계속 넘기면 처음으로 이어짐.\"],[\"조건\",\"넘긴 정도가 약 60°(1/3)보다 많거나 탭하면 자동으로 끝까지 넘어가고, 그보다 적으면 되돌아감. 넘김은 ease in-out.\"],[\"변수\",\"넘김 시간 200-1200ms, 넘어가는 기준 각도 20-120°, 그림자 세기 0-70% 범위로 조절 가능 (기본값: 520ms, 60°, 30%)\"]]},\"90\":{\"t\":\"박자 컷\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 한가운데에 흰색 알약 버튼 '음악 켜기'만 있음. 음악을 켜면 보일 4개의 장면이 준비되어 있음. ① 빨간 배경에 큰 크림색 원과 굵은 검정 '울림' ② 검정 배경에 노란 삼각형 테두리와 노란 'BEAT' ③ 파란 배경에 흰 대각선 줄무늬와 흰 'PULSE' ④ 연두 배경에 큰 검정 별과 검정 'GO'.\"],[\"트리거\",\"'음악 켜기' 버튼을 탭하면.\"],[\"반응\",\"버튼이 하단 중앙으로 내려가며 글자가 '음악 끄기'로 바뀌고, 즉시 박자에 맞춰 음악(킥 드럼·하이햇·베이스)이 나오면서 장면이 0.5초(120BPM)마다 컷으로 딱딱 바뀜. 컷이 바뀔 때마다 도형은 살짝 커졌다가 회전하며 제자리로 튕기고 글자는 아래에서 올라오듯 나타남. '음악 끄기'를 누르면 소리와 장면이 모두 멈추고 다시 검은 화면과 가운데 '음악 켜기' 버튼만 남음.\"],[\"조건\",\"음악을 켜기 전에는 어떤 모션도 재생되지 않음. 카드가 화면 밖에 있으면 장면 전환도 멈춤.\"],[\"변수\",\"BPM 120 (0.5초당 1컷); 박자 간격 250-1000ms, 킥 소리 크기 20-100% 범위로 조절 가능 (기본값: 500ms, 90%)\"]]},\"91\":{\"t\":\"화면 속 화면\",\"r\":[[\"오브젝트\",\"베이지색 큰 사각형 카드('바깥' 텍스트) 중앙에 작은 어두운 화면(기기)이 있고, 그 화면 안에는 같은 구성이 반복됨. 화면 안은 남색 배경의 '안쪽'(노란 기기), 그 안은 연두색 배경에 흰 원이 있는 '가장 안쪽' 순으로 3단계 중첩. 각 단계마다 좌측 상단 제목과 우측 상단 가는 선, 하단에 원·사분원 장식이 있음. 하단에 작은 안내 '눌러서 화면 속으로 들어가기'.\"],[\"트리거\",\"카드를 탭하면.\"],[\"반응\",\"탭할 때마다 카메라가 중앙의 작은 화면 속으로 확대되어 들어가며 바깥 단계는 화면 밖으로 사라지고, 화면 안에 있던 다음 단계가 카드 전체 크기로 펼쳐짐('바깥' → '안쪽' → '가장 안쪽'). 가장 안쪽에서 한 번 더 탭하면 모든 단계를 거쳐 한 번에 줌 아웃하며 '바깥'으로 돌아옴. 가장 안쪽의 흰 원은 은은하게 맥박처럼 커졌다 작아짐.\"],[\"조건\",\"전환 중에는 탭이 무시됨. 들어갈 때 약 0.9초, 한 번에 빠져나올 때 약 1.5초(ease in-out).\"],[\"변수\",\"한 단계 이동 시간 400-2000ms, 처음으로 되감는 시간 500-3000ms 범위로 조절 가능 (기본값: 900ms, 1500ms)\"]]},\"92\":{\"t\":\"색종이 터짐\",\"r\":[[\"오브젝트\",\"연한 회색 큰 사각형 카드 중앙에 파란색 알약 버튼 '완료'가 있음. 상단에 작은 회색 안내 '탭하면 터져요'.\"],[\"트리거\",\"버튼을 탭하면.\"],[\"반응\",\"버튼이 알약에서 초록색 원으로 탱글하게 변하면서 글자가 사라지고 그 안에 하얀 체크 표시가 그어지듯 그려짐. 동시에 버튼 중앙에서 여러 색(핑크·노랑·파랑·민트·보라·주황)의 색종이가 사방으로 터져 나가 위로 솟았다가 중력으로 떨어지며 서서히 사라짐. 다시 탭하면 원래 파란 알약으로 돌아감.\"],[\"조건\",\"색종이는 약 90개, 터진 뒤 약 2초 안에 모두 사라짐. 터지는 중에도 다시 탭하면 알약으로 복귀.\"],[\"변수\",\"색종이 개수 30-200개, 터지는 세기 100-600, 중력 세기 200-1000px/s² 범위로 조절 가능 (기본값: 90개, 300, 520px/s²)\"]]},\"93\":{\"t\":\"상자 열기\",\"r\":[[\"오브젝트\",\"짙은 보라색 큰 사각형 카드 중앙에 보라색 선물 상자(금색 리본과 리본 매듭)가 놓여 있음. 하단에 작은 안내 '상자를 눌러 보세요 (0 / 3)'.\"],[\"트리거\",\"상자를 3번 탭하면(1~2번째 탭에서는 열리지 않음).\"],[\"반응\",\"탭할 때마다 상자가 흔들리고 뚜껑이 조금씩 들썩이며 틈새로 금빛이 점점 더 새어 나옴(1번째: 살짝, 2번째: 더 크게). 하단 안내의 숫자도 (1 / 3), (2 / 3)으로 올라감. 3번째 탭에서는 상자가 크게 흔들린 뒤 뚜껑이 위로 튀어 올라 비스듬히 날아가고, 금빛 광선이 사방으로 퍼지며 천천히 회전함. 동시에 카드 3장('푸른 보석 · 희귀', '별빛 조각 · 영웅', '황금 코인 · 전설')이 상자에서 튀어나와 부채꼴로 펼쳐지며 순서대로 통통 튀며 자리잡음. 이후 우측 상단에 '다시' 버튼이 나타나 누르면 상자가 처음 상태(0 / 3)로 닫힘.\"],[\"조건\",\"상자는 정확히 3번째 탭에서만 열림. 카드는 0.1초 간격으로 순차 등장, 이미 열린 상태에서는 상자를 눌러도 반응하지 않음.\"],[\"변수\",\"열기까지 필요한 탭 수 3; 열리는 데 필요한 탭 수 2-6번, 뚜껑 열리는 각도 10-60° 범위로 조절 가능 (기본값: 3번, 26°)\"]]},\"94\":{\"t\":\"오려 붙인 콜라주\",\"r\":[[\"오브젝트\",\"베이지색 점무늬 종이 느낌의 큰 스크롤 카드. 처음에는 중앙에 큰 굵은 글씨 '여름 스크랩'과 작은 회색 '스크롤해 보세요', 아래로 향한 화살표가 있음. 카드 안에는 아직 보이지 않지만 마스킹테이프 '여름의 기록', 노란 포스트잇(7월 마지막 주 메모), 파란 메모('조개 두 개'), 바다 사진, 노을 사진, 분홍 리본 '파도 소리 · 늦은 오후'가 준비되어 있음. 우측에 스크롤 인디케이터 배치.\"],[\"트리거\",\"카드 안에서 일정 범위(전체 스크롤의 약 25%) 이상 스크롤하면.\"],[\"반응\",\"제목 문구는 스크롤에 따라 위로 올라가며 사라지고, 일정 범위를 넘어서는 순간 스크랩 6개가 한 번에 '차자자자작' 붙음. 테이프 → 바다 사진 → 노란 메모 → 파란 메모 → 노을 사진 → 분홍 리본 순서로 약 0.1초 간격을 두고, 각각 조금 크게 위에서 내려오며 살짝 튕기듯 제 자리에 안착하고 기울기가 잡힘. 다시 맨 처음(스크롤 상단)으로 올려 보내면 스크랩이 모두 사라지고 처음 상태로 초기화됨.\"],[\"조건\",\"붙는 동작은 스크롤 25% 지점을 넘을 때 한 번만 실행되고, 스크롤을 4% 이하로 되돌렸을 때 초기화되어 다시 실행 가능.\"],[\"변수\",\"붙기 시작하는 스크롤 위치 10-60%, 붙는 간격 30-250ms 범위로 조절 가능 (기본값: 25%, 95ms)\"]]},\"95\":{\"t\":\"픽셀 캐릭터 반복 동작\",\"r\":[[\"오브젝트\",\"어두운 보라색 밤하늘(반짝이는 별, 픽셀 달)과 초록 풀밭이 있는 큰 사각형 카드. 풀밭 위 왼쪽에 도트(픽셀 아트) 스타일의 마법사(보라 모자, 흰 수염, 파란 로브, 지팡이)가 서 있고 제자리에서 두 프레임으로 위아래로 들썩이며 숨쉬는 동작을 반복함. 상단에 작은 안내 '커서를 올려 마법을 걸어 보세요'.\"],[\"트리거\",\"카드 위에 커서를 올리고 움직이면.\"],[\"반응\",\"마법사가 지팡이를 높이 들어 올리는 동작으로 바뀌고, 지팡이 끝에서 커서 위치를 향해 도트 모양의 반짝이(하늘색·분홍·노랑·흰색·연보라)가 계속 뿜어져 나가 흩어지며 사라짐. 커서가 움직이면 반짝이가 날아가는 방향도 따라 바뀜. 커서가 카드 밖으로 나가면 지팡이를 내리고 다시 숨쉬는 동작으로 돌아감.\"],[\"조건\",\"모든 그림은 5px 도트 단위로만 그려지며 반짝이는 4px 사각형, 수명이 다하면 2px로 줄어들며 사라짐.\"],[\"변수\",\"마법 알갱이 양 20-200, 알갱이 속도 40-220% 범위로 조절 가능 (기본값: 70, 100%)\"]]},\"96\":{\"t\":\"만화경 무늬\",\"r\":[[\"오브젝트\",\"짙은 남보라색 큰 사각형 카드 중앙에 황동 테두리를 두른 동그란 만화경 렌즈가 있음. 렌즈 안에는 보석 같은 반투명 유리 조각(원·삼각형·직사각형·타원, 빨강·주황·청록·파랑·보라·분홍·노랑 등)들이 떠다니고, 이를 여러 장의 거울이 반사해 부채꼴 조각이 좌우 대칭으로 반복되는 실제 만화경 같은 무늬를 만듦. 하단에 작은 안내 '커서를 움직여 무늬를 바꿔 보세요'.\"],[\"트리거\",\"카드 위에서 커서를 움직이면.\"],[\"반응\",\"렌즈 안의 유리 조각들은 가만히 있어도 천천히 떠다니고 무늬 전체가 천천히 회전하며 계속 모양이 바뀜. 커서를 움직이면 커서 위치를 따라 거울이 비추는 영역이 크게 이동해 무늬가 완전히 다른 모양으로 바뀌고, 커서의 상하 위치에 따라 거울의 수(대칭 개수, 4~9방향)가 바뀌어 무늬의 복잡도가 달라짐. 커서를 빠르게 휘저을수록 회전과 유리 조각의 움직임이 순간적으로 빨라졌다가 서서히 가라앉음. 커서가 카드 밖으로 나가면 다시 스스로 천천히 변하는 상태로 돌아감.\"],[\"조건\",\"무늬 변화는 부드럽게(ease-out) 따라오며, 대칭 개수가 바뀔 때도 끊김 없이 이어짐.\"],[\"변수\",\"기본 조각 수 3-8개, 기본 회전 속도 0-100, 마우스 따라오는 속도 2-15 범위로 조절 가능 (기본값: 4개, 18, 5)\"]]},\"97\":{\"t\":\"소리 막대 반응\",\"r\":[[\"오브젝트\",\"검은색 큰 사각형 카드 중앙에 하늘색 점선이 가로로 놓여 있고, 그 아래에 하늘색 테두리 알약 버튼 3개('샘플 음악 듣기', '내 음악 파일 열기', '마이크 켜기')와 작은 회색 안내 '소리를 하나 골라 보세요'가 있음.\"],[\"트리거\",\"세 버튼 중 하나를 탭하면(샘플 음악 / 내 음악 파일 선택 / 마이크 입력).\"],[\"반응\",\"점선이 사라지고 그 자리에 하늘색 막대 44개가 점선을 기준으로 위아래 대칭으로 나타나, 재생되는 소리의 주파수(저음은 왼쪽, 고음은 오른쪽)에 따라 실시간으로 길이가 오르내림. 선택한 버튼은 하늘색으로 채워지고 안내 문구가 상태('샘플 음악 재생 중', '재생 중: 파일명', '마이크로 들리는 소리에 반응하는 중')로 바뀜. 소리가 끝나거나 같은 버튼을 다시 누르면 막대가 부드럽게 줄어들며 다시 점선으로 돌아가고, 샘플이 끝나면 '샘플 음악이 끝났습니다. 다시 누르면 됩니다.'가 표시됨.\"],[\"조건\",\"마이크가 허용되지 않은 환경에서는 '이 페이지에서는 마이크가 막혀 있어요. 샘플 음악이나 내 음악 파일로 해 보세요.'를 표시함. 샘플 음악은 약 8초(120BPM, 베이스+아르페지오+킥) 재생.\"],[\"변수\",\"막대 높이 40-140, 막대 내려오는 속도 60-95% 범위로 조절 가능 (기본값: 92, 86%)\"]]}}; }\n_pg(n, i, d) {\nconst a = this.$h._pp && this.$h._pp[n];\nreturn a && a[i] !== undefined && !isNaN(a[i]) ? a[i] : d;\n}\n_pc(n, i, d) {\nconst a = this.$h._pp && this.$h._pp[n];\nreturn a && typeof a[i] === 'string' ? a[i] : d;\n}\n_hx(c) {\nconst m = /^#?([0-9a-f]{6})$/i.exec(c || '');\nconst v = m ? parseInt(m[1], 16) : 0;\nreturn [(v >> 16) & 255, (v >> 8) & 255, v & 255];\n}\n_fg(c) {\nconst r = this._hx
