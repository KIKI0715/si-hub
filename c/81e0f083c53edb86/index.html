<!DOCTYPE html>
<html lang="ko"><head>
<!-- 실습 허브 미리보기용 사본. 원본: claude.ai 아티팩트. 받은 날: 2026-11-23 -->
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인터랙션 & 모션 카탈로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Nanum+Brush+Script&display=swap">
<style>
/* Layout: 카드마다 [명세(왼쪽) | 구현 + 조절 패널(오른쪽)]. 좁으면 위아래로 */
:root{
  --bg:#f5f4f1; --surface:#ffffff; --sunk:#efede8; --line:#e4e1da;
  --ink:#1c1b19; --muted:#7a776f; --faint:#a9a59c;
  --label:#2f5d50; --label-bg:#e6efec; --note:#9a6a1a; --mark:#fff0b3; --mark-ink:#5a4200;
  --font-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151513; --surface:#1d1d1a; --sunk:#252521; --line:#33322d;
  --ink:#ecebe6; --muted:#a19e95; --faint:#6e6b63;
  --label:#8fc2b1; --label-bg:#20302b; --note:#d6a95a; --mark:#4a3d10; --mark-ink:#ffe08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151513; --surface:#1d1d1a; --sunk:#252521; --line:#33322d;
  --ink:#ecebe6; --muted:#a19e95; --faint:#6e6b63;
  --label:#8fc2b1; --label-bg:#20302b; --note:#d6a95a; --mark:#4a3d10; --mark-ink:#ffe08a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--label);outline-offset:2px}
#progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;z-index:70;pointer-events:none}
#progress i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#topbar.hide{transform:translateY(-100%)}
#topbar .in{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px}
#topbar .live{color:var(--muted);font-size:13px;text-align:right}
main{max-width:1180px;margin:0 auto;padding-block:56px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero h1{font-size:clamp(30px,5vw,40px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.hero p{color:var(--muted);margin-top:14px;max-width:72ch}
.hero b{color:var(--ink);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:40px 0 20px;padding-top:24px;border-top:1px solid var(--line)}
.ftabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;flex-wrap:wrap}
.ftabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer}
.ftabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.ftabs .n{font-family:var(--font-mono);font-size:12px;margin-left:4px;opacity:.7}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:#b4a98f}
.sync.ok::before{background:var(--label)}
.list{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card:has(.pin-track){overflow:visible}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.num{font-family:var(--font-mono);font-size:13px;color:var(--faint);width:2ch;flex:none}
.name{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:600;padding:2px 0;outline:none}
.name:focus{box-shadow:0 1px 0 var(--label)}
.hint{font-size:12px;color:var(--faint);white-space:nowrap}
.pillst{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pillst.tuned{background:var(--mark);border-color:transparent;color:var(--mark-ink)}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
@media (max-width:900px){.card-body{grid-template-columns:1fr}.right{border-left:0!important;border-top:1px solid var(--line)}}
.spec{display:flex;flex-direction:column;min-width:0}
.row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;padding:11px 22px;border-bottom:1px solid var(--line)}
.row label{font-weight:600;font-size:14px;color:var(--label);padding-top:2px}
.row textarea{width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;line-height:1.65;padding:0;min-height:1.65em;overflow:hidden;outline:none}
.row textarea::placeholder{color:var(--faint)}
.row .view{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.row .view mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 3px}
.row:focus-within{background:color-mix(in srgb,var(--label-bg) 55%,transparent)}
.spec.tuned textarea{display:none}
.spec:not(.tuned) .view{display:none}
.spec-foot{display:grid;gap:10px;padding:12px 22px 16px;background:var(--sunk);margin-top:auto}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot-row small{color:var(--note);font-size:12.5px}
.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;padding:5px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.sbtn:hover{border-color:var(--label)}
.sbtn:disabled{opacity:.45;cursor:default}
.ai{display:flex;gap:8px}
.ai input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;outline:none}
.ai input:focus{border-color:var(--label)}
.ai-msg{font-size:12px;color:var(--muted);min-height:1.2em}
.right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.stage{position:relative;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 20px}
.stage.free{padding:0;justify-content:flex-start}
.knobs{border-top:1px solid var(--line);padding:14px 20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;background:var(--surface)}
.knobs-h{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em}
.knob{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:12.5px}
.knob label{color:var(--muted)}
.knob output{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.knob input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--label);margin:0}
.knob select{grid-column:1/-1;font:inherit;font-size:12.5px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.knob.changed label{color:var(--mark-ink);background:var(--mark);border-radius:4px;padding:0 4px;justify-self:start}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.parts{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.parts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:clamp(17px,2.4vw,22px);font-weight:700;padding:14px 30px;border-radius:999px;cursor:pointer}
.parts button span{font-size:.72em;font-weight:500;color:var(--muted);margin-left:6px}
.parts button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.parts button[aria-pressed="true"] span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:16px;max-width:1160px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--font-mono);font-size:13px;padding:9px 0;border-radius:10px;cursor:pointer}
.chips button:hover{border-color:var(--ink);color:var(--ink)}
.chips button.inpage{border-color:#3B5BDB;color:#3B5BDB;background:color-mix(in srgb,#3B5BDB 8%,var(--surface))}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:36px 0 4px;flex-wrap:wrap}
.sec-h b{font-size:17px;font-weight:700}.sec-h small{color:var(--muted);font-size:12.5px}
.part{display:flex;flex-direction:column;gap:16px}
</style>
<style>
/* ── 데모 공통: 테마와 무관하게 밝은 패널 ── */
.demo{--ink:#15171C;--card:#fff;--paper:#ECEEF1;--line2:#D9DCE2;--mut:#6B6F78;--cobalt:#2F4BFF;
  width:100%;background:#ECEEF1;border-radius:16px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:280px;position:relative;overflow:hidden;color:#15171C}
.demo.free{background:transparent;padding:0;overflow:visible;display:block;min-height:0}
.demo.flush{padding:0}
.s-pill{border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;background:#15171C;color:#fff}
.ghost{border:1.5px solid #15171C;background:transparent;color:#15171C;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.ghost:hover{background:#15171C;color:#fff}
.dhint{font-size:12.5px;color:#6B6F78;margin:0;text-align:center}
.phone{position:relative;width:min(280px,100%);height:440px;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 20px 44px rgb(21 23 28/.16);border:6px solid #15171C}
input[type=range].dr{-webkit-appearance:none;appearance:none;width:min(300px,80%);height:26px;background:transparent;cursor:pointer}
input[type=range].dr::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#15171C var(--p,50%),rgb(21 23 28/.15) var(--p,50%))}
input[type=range].dr::-moz-range-track{height:8px;border-radius:4px;background:rgb(21 23 28/.15)}
input[type=range].dr::-moz-range-progress{height:8px;border-radius:4px;background:#15171C}
input[type=range].dr::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:#fff;border:4px solid #15171C}
input[type=range].dr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #15171C}
/* 01 */
.nudge1{display:inline-flex;align-items:center;gap:14px;background:var(--c);color:#fff;border:0;border-radius:999px;padding:10px 10px 10px 26px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.nudge1 .ar{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center}
.nudge1 svg{width:18px;height:18px;transition:transform var(--d) cubic-bezier(.2,.8,.2,1)}
.nudge1:hover svg,.nudge1:focus-visible svg{transform:translateX(var(--x))}
/* 02 */
.mz2{width:100%;height:280px;display:grid;place-items:center}
.mz2 .ring{position:absolute;border-radius:50%;border:1.5px dashed rgb(47 75 255/.3);pointer-events:none}
.mag2{width:136px;height:136px;border-radius:50%;border:0;background:var(--c);color:#fff;font:inherit;font-weight:700;cursor:pointer;will-change:transform;position:relative}
.mag2 span{display:block;will-change:transform}
/* 03 */
.b2f{font-size:clamp(24px,3.4vw,36px);font-weight:700;letter-spacing:-.02em;text-align:center;user-select:none;-webkit-user-select:none;margin:0;touch-action:none;padding:40px 10px;width:100%}
.b2f span{display:inline-block;transition:filter var(--d) ease-out}
/* 04 */
.hz-zone{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:20px 0}
.hz{position:relative;width:min(190px,38vw);aspect-ratio:16/9;border-radius:12px;overflow:hidden;cursor:pointer;z-index:1;transition:transform .2s ease-in,box-shadow .2s}
.hz::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgb(0 0 0/.35),transparent 60%);opacity:0;transition:opacity .2s}
.hz .cap{position:absolute;left:12px;right:12px;bottom:9px;overflow:hidden;color:#fff;font-weight:700;font-size:12.5px;z-index:1}
.hz .cap span{display:block;transform:translateY(110%);opacity:0;transition:transform .15s ease-in,opacity .15s}
.hz:hover,.hz:focus-visible{transform:scale(var(--s));z-index:2;box-shadow:0 16px 30px rgb(21 23 28/.2);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.hz:hover::after,.hz:focus-visible::after{opacity:1}
.hz:hover .cap span,.hz:focus-visible .cap span{transform:none;opacity:1;transition:transform .35s cubic-bezier(.2,.8,.2,1) var(--dl),opacity .35s var(--dl)}
/* 05 */
.ul-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g);font-size:20px;font-weight:700}
.ul-nav a{position:relative;color:#15171C;text-decoration:none;padding-bottom:7px}
.ul-nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--t);border-radius:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-in}
.ul-nav a:hover::after,.ul-nav a:focus-visible::after{transform:scaleX(1);transition:transform var(--d) cubic-bezier(.2,.8,.2,1) var(--dl)}
/* 06 */
.cur-play{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.cur-img{width:130px;aspect-ratio:1;border-radius:50% 50% 12px 12px;background:linear-gradient(160deg,#FF9EC7,#9C84FF)}
/* 07 */
.sr-row{display:flex;gap:12px;align-items:flex-end;justify-content:center;height:180px}
.sr-row b{display:block;width:min(90px,22vw);border-radius:12px}
/* 08 */
.plx-bg{position:absolute;inset:0}
.plx-front{position:relative;width:min(230px,60vw);aspect-ratio:3/2;border-radius:16px;background:#15171C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;box-shadow:0 20px 40px rgb(21 23 28/.3)}
.plx-meter{width:80%;height:8px;border-radius:4px;background:rgb(255 255 255/.15);overflow:hidden}
.plx-meter i{display:block;height:100%;transform-origin:0;transform:scaleX(0)}
/* 09 */
.sp9{position:relative;width:min(420px,100%);height:280px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgb(21 23 28/.08)}
.sp9-top{position:absolute;left:0;right:0;top:0;background:#E7E2DA;z-index:2}
.sp9-top i{display:block;height:100%;transform-origin:0;transform:scaleX(0)}
.sp9-body{position:absolute;right:22px;bottom:0;left:0;overflow-y:auto;padding:14px 16px 18px 20px;scrollbar-width:none;overscroll-behavior:contain;font-size:14px;color:#3A3D45}
.sp9-body::-webkit-scrollbar{display:none}
.sp9-body p{display:flex;gap:12px;padding:5px 0;border-bottom:1px dashed #ECE8E1;margin:0}
.sp9-body b{font-family:var(--font-mono);font-size:11px;font-weight:400;color:#A39E95;padding-top:2px}
.sp9-track{position:absolute;right:6px;top:14px;bottom:8px;width:10px;border-radius:5px;background:#EFEBE4;cursor:pointer;touch-action:none}
.sp9-thumb{position:absolute;left:0;right:0;top:0;border-radius:5px;cursor:grab}
/* 10 */
.mask-lines{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.2;text-align:center;margin:0}
.mask-lines .ln{display:block;overflow:hidden;padding-bottom:.06em}
.mask-lines .ln span{display:block}
/* 11 */
.pin-track{position:relative;height:240vh}
.pin-sticky{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:min(60vh,420px);border-radius:16px;overflow:hidden;display:grid;place-items:center}
.pin-shape{width:140px;height:140px;will-change:transform,border-radius}
.pin-label{position:absolute;left:22px;bottom:22px;font-size:clamp(19px,2.6vw,26px);font-weight:700;margin:0}
.pin-dots{position:absolute;right:22px;bottom:28px;display:flex;gap:8px}
.pin-dots i{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.25;transition:opacity .3s,transform .3s}
.pin-dots i.on{opacity:1;transform:scale(1.3)}
.pin-line{position:absolute;left:0;right:0;top:0;height:4px}
.pin-line i{display:block;height:100%;background:currentColor;transform-origin:0;transform:scaleX(0)}
.pin-step{position:absolute;top:20px;left:22px;font-family:var(--font-mono);font-size:12px;opacity:.7}
/* 12 */
.ah-head{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-weight:700;font-size:13px;z-index:2}
.ah-head.hide{transform:translateY(-100%)}
.ah-head .logo{width:22px;height:22px;border-radius:50%;background:#fff}
.ah-body{position:absolute;inset:0;overflow-y:auto;padding:68px 14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overscroll-behavior:contain}
.ah-body div{aspect-ratio:9/16;border-radius:14px}
/* 13 */
.car{width:100%;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;padding-block:8px}
.car-track{display:flex;gap:16px;will-change:transform;padding-left:8px}
.car-card{flex:none;width:180px;height:220px;position:relative;display:flex;align-items:flex-end;padding:16px;font-weight:700;font-size:20px}
.car-card i{position:absolute;top:18px;right:20px;font-style:normal}
.car-dots{display:flex;gap:6px}
.car-dots b{width:20px;height:4px;border-radius:2px;background:#15171C;opacity:.2;transition:opacity .3s}
.car-dots b.on{opacity:1}
/* 14 */
.ba{position:relative;width:100%;height:280px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.ba .layer{position:absolute;inset:0}
.ba .tag{position:absolute;top:12px;font-family:var(--font-mono);font-size:11px;background:rgb(21 23 28/.8);color:#fff;padding:3px 9px;border-radius:999px;z-index:3}
.ba-handle{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;z-index:3}
.ba-handle button{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid currentColor;background:#15171C;color:#fff;cursor:ew-resize;font-size:13px}
.scene{position:absolute;inset:0;background:linear-gradient(#9EC3FF,#FFE8B0)}
.scene .sun{position:absolute;width:96px;height:96px;border-radius:50%;background:#FF5E3A;left:62%;top:12%}
.scene .h1{position:absolute;width:140%;height:70%;left:-30%;top:58%;border-radius:50%;background:#3FCB9B}
.scene .h2{position:absolute;width:110%;height:60%;left:30%;top:66%;border-radius:50%;background:#1E8F6A}
.scene .house{position:absolute;left:22%;top:44%;width:66px;height:52px;background:#FFD449}
.scene .house::before{content:"";position:absolute;left:-8px;right:-8px;top:-32px;height:32px;background:#2F4BFF;clip-path:polygon(50% 0,100% 100%,0 100%)}
.scene .win{position:absolute;left:22px;top:14px;width:20px;height:20px;background:#7FD6F0}

인다. 스크롤 1px당 0.4px", "condition": "없음", "variable": ""}, "9": {"name": "", "object": "다양한 글이 적힌 박스(25줄 이상), 상단에는 가로로 긴 막대, 오른쪽에는 세로로 긴 막대와 스크롤용 작은막대,", "trigger": "글을 아래로 스크롤 할 때", "response": "동시에 우측 작은막대가 아래로 이동한다. 위쪽 가로 막대도 스크롤 퍼센테이지에 따라 왼쪽에서 오른쪽으로 주황색막대가 차오른다. ", "condition": "스크롤함과 동시에 우측과 상단의 막대가 움직여야한다", "variable": ""}, "10": {"name": "마스크드 텍스트 리빌 (Masked Text Reveal)", "object": "세 줄로 된 문장이\n\"문장이 줄 단위로,\n아래에서 걷히듯,\n차례로 나타난다.\"\n아래에는 다시보기 토글 생성", "trigger": "문장이 화면에 들어왔을 때", "response": "한 줄씩 0.12초 간격으로 아래에서 위로 걷히듯 0.7초 동안 올라온다", "condition": "줄 밖으로 나간 글자는 보이지 않는다. 다시보기 버튼을 누르면 처음부터 다시 실행된다", "variable": "없음"}, "11": {"name": "스크롤 피닝 (Scroll Pinning)", "object": "도형과 단계 문구가 있는 패널이", "trigger": "패널이 화면 위에 닿은 뒤 아래로 계속 스크롤을 할 때", "response": "패널은 화면에 고정된 채로, 스크롤할수록 원이 둥근 사각형을 거쳐 마름모로 변하고 1.35배까지 커진다. 단계가 바뀌면 배경과 도형 색이 0.5초 동안 3단계로 바뀌고 문구가 아래에서 올라온다", "condition": "스크롤 0~40% 1단계(주황색), 40~80% 2단계(파란색), 80% 이후 3단계 “완료!”(초록색)로 바뀐다. 12번이 아래에서 닿으면 고정이 풀린다", "variable": "스크롤 진행률, 현재 단계"}, "12": {"name": "오토하이드 헤더 (Auto-hide Header)", "object": "폰 화면 위쪽의 코랄색 헤더가\n본문은 14개의 세로로긴 직사각형(다양한 색상)", "trigger": "화면 안에서 스크롤을 할 때", "response": "아래로 내리면 헤더가 위로 0.3초 동안 올라가 사라지고, 위로 올리면 다시 내려온다", "condition": "맨 위(56px 이내)에서는 항상 보인다. 4px 이하의 작은 움직임에는 반응하지 않는다", "variable": "직전 스크롤 위치"}, "13": {"name": "드래그 캐러셀 (Draggable Carousel)", "object": "색과 모양이 다른 카드 7장이", "trigger": "카드를 옆으로 끌 때", "response": "끄는 만큼 카드가 따라오고, 놓으면 던진 속도만큼 더 미끄러진 뒤 가장 가까운 카드에 0.5초 동안 붙는다", "condition": "양 끝을 넘어서 끌면 %만 따라오고, 놓으면 끝으로 돌아온다", "variable": "카드 위치, 끄는 속도"}, "14": {"name": "비포/애프터 (Before / After)", "object": "같은 풍경의 왼쪽 흑백(비포)·오른쪽 컬러(애프터) 이미지와 가운데 흰 핸들이", "trigger": "핸들(또는 이미지)을 좌우로 끌 때", "response": "핸들이 마우스커서 위치로 바로 따라오고, 핸들 왼쪽은 비포, 오른쪽은 애프터가 보인다", "condition": "이미지 양 끝(0~100%) 밖으로는 나가지 않는다. 시작 위치는 가운데(50%)\n왼쪽은 밤, 오른쪽은 낮", "variable": "핸들 위치"}, "15": {"name": "로터리 다이얼 (Rotary Dial)", "object": "흰 세로막대 지시선이 있는 검정 다이얼과 주변 8개 눈금이 ", "trigger": "다이얼을 잡고 돌릴 때", "response": "돌린 각도만큼 바로 회전하고, 손을 떼면 가장 가까운 눈금(45° 간격)으로 0.35초 back.out으로 붙는다. 선택된 눈금과 뒤 원 색, “작품 N” 글자가 바뀐다", "condition": "한 바퀴를 넘기면 작품 1로 돌아온다. 다이얼이 돌아갈 때, 가리키는 눈금색이 무지개색으로 바뀐다. ", "variable": "회전 각도, 선택된 작품(1~8)"}, "16": {"name": "드래그 앤 드롭 정렬 (Drag & Drop Reorder)", "object": "“스케치(노랑) · 모델링(초록) · 렌더링(파랑) · 발표(주황)” 항목 네 개가", "trigger": "항목블록을 마우스 커서로 누른 상태에서 위아래로 끌 때", "response": "끄는 항목이 1.03배 커지며 떠올라 마우스커서를 따라오고, 다른 항목의 절반을 넘으면 자리가 바뀌며 밀린 항목이 0.25초 동안 주변(위,아래)으로 미끄러진다", "condition": "손을 떼면 0.2초 동안 바뀐 자리에 들어간다. 순번도 같이 바뀐다 선택이 될 경우, 뒷배경에 그림자가 생긴다. ", "variable": "항목 순서"}, "17": {"name": "슬라이더 매핑 (Value Mapping)", "object": "온도 원과 아래쪽 가로로 긴 슬라이더가", "trigger": "슬라이더를 움직일 때", "response": "값에 따라 온도가 16~30°로 바뀌고, 원이 0.8~1.2배로 커지며, 색이 파랑 → 노랑 → 주황으로 바뀐다", "condition": "중간 온도(값 30~75)에서는 숫자가 검정, 나머지는 흰색\n슬라이더가 좌측에서 우측으로 이동하면 이동한만큼 검정색으로 바뀐다", "variable": "슬라이더 값(0~100)"}, "18": {"name": "컨디셔널 스테이트 (Conditional States)", "object": "도형 하나와 상태 글자, 아래 슬라이더가", "trigger": "슬라이더를 움직여 다른 구간으로 넘어갈 때", "response": "도형 모양과 색이 0.45초 동안 통통 튀듯 바뀌고, 상태 글자가 살짝 커졌다 돌아온다", "condition": "0~24 준비(보라 동그라미), 25~59 진행(파랑 둥근 네모), 60~89 거의 다(노랑 마름모), 90~100 완료!(민트 잎 모양). 같은 구간 안에서 움직일 때는 바뀌지 않는다", "variable": "슬라이더 값, 지금 구간"}, "19": {"name": "테마 토글 (Theme Toggle)", "object": "글과 칩이 있는 카드와 해 모양 스위치가", "trigger": "스위치를 누를 때", "response": "카드 배경, 글자, 칩 색이 0.4초 동안 한꺼번에 밝은 테마 ↔ 어두운 테마로 바뀌고, 스위치 손잡이가 반대쪽으로 이동하면서 해가 달로 바뀐다", "condition": "누를 때마다 밝은 테마와 어두운 테마가 번갈아 바뀐다", "variable": "지금 테마"}, "20": {"name": "프로그레스 게이지 (Progress Gauge)", "object": "원형 게이지와 가로 막대, 가운데 숫자가", "trigger": "슬라이더를 움직일 때", "response": "게이지와 막대가 값만큼 0.35초 동안 차오르고 숫자가 바뀐다", "condition": "0~29 코랄, 30~69 노랑, 70~100 민트로 색이 바뀐다", "variable": "진행 값(0~100)"}, "21": {"name": "프리셋 리콜 (Preset Save & Recall)", "object": "온도·시간 슬라이더 두 개와 “세팅 1”, “세팅 2” 버튼이", "trigger": "세팅 버튼을 짧게 누르거나 길게 누를 때", "response": "짧게 누르면 두 슬라이더가 저장해 둔 값으로 0.4초 동안 스르륵 움직인다. 0.6초 이상 길게 누르면 버튼 안이 민트색으로 차오르고, 다 차면 지금 값이 저장되며 버튼이 한 번 반짝인다", "condition": "다 차기 전에 손을 떼면 저장하지 않고 불러오기만 한다. 처음에는 세팅 1(온도 30·시간 60), 세팅 2(온도 75·시간 20)가 들어 있다", "variable": "세팅 1·2에 저장된 온도와 시간"}, "22": {"name": "푸시 트랜지션 (Push Transition)", "object": "폰 화면의 작품 목록과 상세 화면이", "trigger": "목록의 작품(다양한 색상으로 구분)을 탭하거나, 상세에서 ‘‹ 내 작품’을 누를 때", "response": "상세 화면이 오른쪽에서 밀고 들어오고, 목록은 왼쪽으로 30% 물러나며 살짝 어두워진다. 0.42초. 뒤로가기는 반대로", "condition": "상세 화면 색과 제목은 탭한 작품의 것으로 바뀐다", "variable": "선택한 작품"}, "23": {"name": "바텀 시트 (Bottom Sheet)", "object": "폰 화면 아래에 숨어 있는 흰 시트(옵션 3개)와 뒤의 어두운 배경이", "trigger": "“옵션 열기” 버튼을 누를 때 / 시트 위 손잡이나 어두운 배경을 누를 때", "response": "시트가 아래에서 0.45초 동안 살짝 튕기듯 올라오고, 뒤 화면이 어두워진다. 닫을 때는 반대로 내려간다", "condition": "시트가 열려 있는 동안에는 뒤 화면을 누를 수 없다", "variable": "열림 여부"}, "24": {"name": "슬라이딩 탭 인디케이터 (Sliding Tab Indicator)", "object": "홈 · 보관함 · 설정 탭과 뒤에 깔린 알약 모양 표시가", "trigger": "탭을 누를 때", "response": "알약이 누른 탭으로 0.38초 동안 통통 튀듯 미끄러지면서 탭 크기에 맞게 늘었다 줄고, 색이 파랑·코랄·민트로 바뀐다. 아래 내용도 살짝 올라오며 바뀐다", "condition": "없음", "variable": "선택된 탭"}, "25": {"name": "카드 플립 시퀀스 (Card Flip Sequence)", "object": "“스마트인터”가 적힌 카드 5장이", "trigger": "재생 버튼을 누를 때", "response": "왼쪽 카드부터 0.12초 간격으로 0.5초 동안 뒤집히며 뒷면 “랙션디자인”이 나타난다", "condition": "되돌리기를 누르면 오른쪽 카드부터 다시 뒤집힌다\n랙션디자인은 재생버튼을 누를때마다 무지개색으로 다양하게 바뀐다.", "variable": "앞면 / 뒷면 상태"}, "26": {"name": "와이프 트랜지션 (Wipe Transition)", "object": "화면 A(왼쪽에 빨간색동그라미, 배경은흰색)와 화면 B(오른쪽에 노란색 마름모,배경은 검정)가", "trigger": "전환 버튼을 누를 때", "response": "화면 B가 왼쪽에서 오른쪽으로 0.6초 동안 닦아내듯 A를 덮는다. 다시 누르면 B가 반대 방향으로 걷히며 A가 나온다", "condition": "전환되는 동안에는 버튼이 눌리지 않는다", "variable": "현재 화면"}, "27": {"name": "풀 투 리프레시 (Pull to Refresh)", "object": "폰 화면 속 색깔 칩이 붙은 할 일 목록과, 목록 위에 숨어 있는 새로고침(↻) 아이콘이", "trigger": "목록을 마우스로 잡고 아래로 끌어내릴 때", "response": "목록이 끌려 내려오면서 위에 숨어 있던 ↻ 아이콘이 나타나고, 끄는 만큼 빠르게 돌아간다. 충분히 끌어내렸다가 놓으면 아이콘이 1.2초 동안 빙글빙글 돌고, 맨 위에 “새 항목”이 노랗게 반짝이며 생긴 뒤 목록이 제자리로 올라간다", "condition": "조금만 끌다 놓으면 새로고침 없이 0.3초 동안 튕기듯 돌아간다. 새로고침 중에는 다시 끌 수 없다", "variable": "끌어내린 거리, 새로고침 중인지"}, "28": {"name": "파티클 버스트 (Particle Burst)", "object": "흰 동그라미 버튼 안의 빈 하트와 옆의 좋아요 숫자가", "trigger": "하트를 누를 때", "response": "하트가 빨갛게 채워지면서 크게 커졌다가 0.35초 동안 통통 튀며 돌아오고, 하트에서 빨강·주황·노랑·분홍 작은 점 12개가 사방으로 터져 나가며 0.6초 동안 사라진다. 숫자가 1 올라간다", "condition": "다시 누르면 빈 하트로 돌아가고 살짝 작아졌다 돌아오며, 점은 터지지 않고 숫자가 1 내려간다", "variable": "없음"}, "29": {"name": "스켈레톤 UI (Skeleton Screen)", "object": "흰 카드 안의 회색 뼈대(사진 자리, 제목 줄, 글 줄 두 개)와 아래 “다시 로딩” 버튼이", "trigger": "카드가 화면에 보일 때 / 다시 로딩 버튼을 누를 때", "response": "로딩 중에는 회색 뼈대 위로 밝은 빛이 1.2초마다 왼쪽에서 오른쪽으로 지나간다. 1.6초가 지나면 뼈대가 0.4초 동안 사라지면서 그 자리에 진짜 사진·제목·설명이 나타난다", "condition": "다시 로딩을 누르면 처음 회색 뼈대로 돌아가 다시 기다린다", "variable": "로딩이 끝났는지"}, "30": {"name": "스와이프 액션 (Swipe Actions)", "object": "메일 목록 세 줄과 각 줄 뒤에 숨어 있는 빨간 “삭제” 버튼이", "trigger": "메일 줄을 마우스로 잡고 왼쪽으로 밀 때", "response": "줄이 미는 만큼 따라오며 뒤의 빨간 삭제 버튼이 보인다. 절반 넘게 밀고 놓으면 삭제 버튼이 보이는 상태로 멈추고, 삭제를 누르면 그 줄이 0.3초 동안 접히며 사라진다", "condition": "조금만 밀고 놓으면 다시 닫힌다. 삭제 버튼보다 더 밀면 뻑뻑해져서 잘 안 밀린다. 한 줄을 열어 둔 채 다른 줄을 밀면 열린 줄은 닫힌다. 다 지우면 “목록 되돌리기” 버튼이 나온다", "variable": "열려 있는 줄, 남은 메일"}, "31": {"name": "시간 경과 상태 변화 (Time-driven State)", "object": "동그란 진행 링(가운데 %)과 상태 글자, “시작” 버튼이", "trigger": "시작 버튼을 눌렀을 때 (그 뒤로는 아무것도 안 해도 진행된다)", "response": "6초 동안 링이 시계 방향으로 차오르고 %가 올라간다. 진행에 따라 상태 글자와 링 색이 바뀐다", "condition": "0% 설정하세요(노랑) → 데우는 중(주황) → 60%부터 곧 완료(빨강) → 100% 완료!(초록). 완료되면 원이 두 번 두근거리고 버튼이 “다시”로 바뀐다. 진행 중에는 버튼을 누를 수 없다", "variable": "진행률, 지금 상태"}, "32": {"name": "인라인 검증 (Inline Validation)", "object": "“이메일” 입력칸과 칸 오른쪽 끝의 초록 체크, 아래 안내 문구가", "trigger": "입력칸에 글자를 칠 때마다", "response": "@ 앞뒤로 글자가 있으면 칸 테두리가 초록색으로 바뀌고 체크가 톡 튀어나오며 “좋아요, 사용할 수 있어요”가 나온다. 아니면 테두리가 빨간색이 되고 “@ 앞뒤로 글자가 있어야 해요”가 나온다. 0.2초", "condition": "칸을 다 지우면 회색 테두리와 “@ 가 들어가면 통과합니다”로 돌아간다", "variable": "입력한 글, 통과했는지"}, "33": {"name": "문자수 카운터 (Character Counter)", "object": "한 줄 소개를 쓰는 입력칸과 아래 막대, 오른쪽 “0 / 40” 숫자가", "trigger": "입력칸에 글자를 칠 때마다", "response": "쓴 글자 수만큼 숫자가 바뀌고 막대가 40자를 기준으로 차오른다", "condition": "30자 전까지는 검정, 30~40자는 주황(곧 넘어요), 40자를 넘으면 빨강 — 넘는 순간 숫자가 톡 커졌다 돌아오고 입력칸 테두리도 빨개진다. 넘어도 글은 계속 쓸 수 있다", "variable": "글자 수"}, "34": {"name": "스텝퍼 (Stepper)", "object": "수량 스텝퍼의 − / + 버튼과 가운데 숫자", "trigger" 54:["글자 늘어남·굵기 출렁임","까만 직사각형 화면 가운데 크고 하얀 영문 대문자 “FLEX” 네 글자가 (보통 굵기, 보통 폭)","커서를 좌우로 움직일 때","커서에 가까운 글자일수록 옆으로 넓게 늘어나고 아주 굵어지고, 먼 글자는 좁고 가늘어진다. 커서에서 180px 안의 글자가 반응한다","커서가 화면을 벗어나면 0.6초 동안 모두 보통 모양으로 돌아온다","커서 위치"],
55:["틀을 넘치는 큰 글자","연한 베이지 바탕 위에 검정 얇은 선으로 그린 네모 틀(화면의 반쯤 크기)과, 그 안의 굵은 빨간 한글 “가득” 두 글자가","상자 안을 스크롤할 때","스크롤할수록 글자가 커져서 최대 2.4배까지 틀 밖으로 넘친다. 틀은 8° 기울어져 있고 글자도 같은 방향으로 살짝 기울어 있다가 점점 바로 선다","위로 올리면 다시 작아져 틀 안으로 들어간다","스크롤 진행률"],
56:["흩어졌다 모이는 글자","까만 화면 가운데 굵은 한글 “타이포그래피” 여섯 글자가. 글자마다 색이 다르다 (노랑·주황·분홍·보라·하늘·민트 순서)","단어를 누를 때","글자가 사방으로 140px쯤 튕겨 나가며 빙글 돌고 크기도 제각각 바뀐 뒤, 잠깐 멈췄다가 0.9초 동안 통통 튀며 제자리로 모인다","모이는 중에 또 누르면 그 자리에서 다시 흩어진다","없음"],
57:["원을 도는 글자 띠","남색에 가까운 까만 화면 가운데 작은 주황 점 하나와, 그 점을 둘러싼 동그란 글자 띠 세 겹이. 바깥 띠는 영어 흰색 대문자 “SMART INTERACTION DESIGN ✦”, 가운데 띠는 주황 한글 “스마트 인터랙션 디자인”, 안쪽 띠는 연보라 영문 “TYPE · RHYTHM · MOTION”","상자 안을 스크롤할 때 (가만히 있어도 천천히 돎)","스크롤하는 동안 바깥 두 띠는 시계 방향, 안쪽 띠는 반대 방향으로 끝까지 360° 돈다. 가만히 있을 때도 1초에 6°씩 천천히 돈다","위로 스크롤하면 거꾸로 돈다","스크롤 진행률, 돈 각도"],
58:["먹물 번짐 글씨","가운데가 밝고 가장자리가 누런 한지 색 바탕과, 누르는 곳에 생기는 까만 붓글씨 한 글자(손으로 쓴 듯한 붓글씨체, 크게)가","화면을 누를 때","누른 자리에 먹물이 떨어진 것처럼 14px 번진 흐릿한 회색 얼룩으로 시작해, 작았다가 살짝 커진 뒤 1.2초 동안 또렷한 까만 붓글씨로 맺힌다. 먹·물·번·짐 순서로 찍힌다","글자는 8개까지 남고, 더 누르면 가장 오래된 것부터 흐려져 사라진다","찍힌 글자 목록"],
59:["깨졌다 복구되는 글자","까만 화면 가운데 아주 굵고 큰 흰 영문 대문자 “GLITCH”가","커서를 글자 위에 올릴 때","글자 뒤로 빨강·하늘색 그림자 글자가 갈라져 나오고, 가로로 얇게 잘린 흰 조각이 8px까지 좌우로 어긋나며 지지직 떨린다","커서를 떼면 0.4초 동안 떨림이 줄어들며 원래 흰 글자로 복구된다","없음"],
60:["알약 하나의 UI 변신","연회색 바탕 가운데, 흰 점 세 개(•••)가 든 작고 가로로 긴 검정 알약 모양 버튼 하나가 (그림자가 살짝 있음)","누를 때마다","0.5초 동안 크기와 둥근 정도가 살짝 튕기듯 바뀌며 변신한다 — 작은 검정 알약 → 긴 알약 플레이어(주황·보라 동그란 앨범, 곡 제목, 흰 동그라미 ▶) → 얇은 볼륨바(스피커 모양, 흰 막대) → 토스트(초록 동그라미 ✓ “저장했어요”) → 모서리가 둥근 큰 네모 카드(제목과 설명 글) → 다시 검정 알약. 안의 내용은 바뀐 모양에 맞춰 나타난다","변신하는 동안에는 눌러도 반응하지 않는다. 아래에 지금 상태 이름이 적혀 있다","지금 모양 순서"],
61:["도형 모핑","밝은 회색 바탕 가운데 큰 파란 동그라미(위는 밝고 아래는 어두운 그라데이션)와, 그 아래 바닥의 흐릿한 회색 타원 그림자가","누를 때마다","0.7초 동안 모양과 색이 부드럽게 바뀐다 — 파란 동그라미 → 코랄 네모 → 노란 세모 → 민트 별(뾰족한 꼭짓점 다섯 개) → 보라 꽃(꽃잎 여섯 장). 바뀔 때 살짝 눌렸다가 위로 튀어 오르고, 그림자는 튈 때 작고 흐려진다","꽃 다음에는 다시 동그라미","지금 모양"],
62:["말랑한 덩어리","까만 화면 위에 크기가 다른 동그란 주황색 덩어리 다섯 개와, 커서를 따라다니는 조금 더 큰 주황 덩어리 하나가. 덩어리끼리 가까워지면 경계가 녹아 하나로 이어진다","커서를 움직일 때","커서를 따라 덩어리 하나가 0.25초 늦게 따라오고, 다른 덩어리에 가까워지면 물엿처럼 붙었다 늘어나며 떨어진다. 나머지 다섯 덩어리는 천천히 둥둥 떠다닌다","커서가 밖으로 나가면 따라오던 덩어리는 가운데로 돌아간다","커서 위치"],
63:["점이 모여 모양","까만 화면 전체에 깨알처럼 흩어진 작은 네모 점 1200개(하늘색, 반짝반짝 깜빡임)와 왼쪽 아래 흰 글씨 진행 표시가","상자 안을 스크롤할 때","스크롤할수록 점들이 제각각 날아와 모여 아주 굵은 영문 “SID” 글자가 된다. 다 모이면 깜빡임이 멈추고 또렷해진다","위로 올리면 다시 흩어진다. 왼쪽 아래에 모인 정도(%)가 표시된다","스크롤 진행률"],
64:["점 격자 물결","까만 화면 위에 바둑판처럼 일정한 간격(22px)으로 놓인 작고 동그란 회색 점들이","격자를 누를 때","누른 곳에서 동그란 물결이 1초에 320px씩 퍼져 나가고, 물결이 지나가는 점은 하늘색으로 밝아지며 커지고 바깥쪽으로 출렁인다","물결은 멀어질수록 약해지고, 여러 번 누르면 물결이 겹친다","물결 목록"],
65:["솟아오르는 블록 바닥","위는 흰색, 아래는 연한 하늘빛 회색인 바탕 가운데, 마름모 모양으로 비스듬히 놓인 바둑판 블록 바닥(12×12칸)이. 블록 윗면은 아주 연한 회색, 옆면은 조금 진한 회색이다","커서를 바닥 위에서 움직일 때","커서 주변 3칸 안의 블록이 최대 40px까지 네모 기둥처럼 솟아오르고, 가까울수록 높고 파란색이 진해진다(윗면은 밝은 파랑, 옆면은 진한 파랑). 커서가 지나가면 천천히 다시 내려앉는다","커서가 바닥 밖에 있으면 모두 평평한 회색으로 돌아간다","칸마다 높이"],
66:["윤곽선 그리기","하늘색 하늘에 살구색 해, 뒤쪽엔 옅은 하늘회색 산들, 가운데엔 꼭대기에 흰 눈이 덮인 큰 초록 세모 산(오른쪽 면은 더 진한 초록)과 짙은 초록 세모 나무 네 그루가 있는 그림 위로, 산 아래에서 꼭대기까지 지그재그로 이어지는 흰 점선 길과 길 위의 주황 동그라미(흰 테두리)가","상자 안을 스크롤할 때","스크롤한 만큼 점선이 아래에서 꼭대기 쪽으로 그려지고, 주황 동그라미가 선 끝을 따라 올라간다. 꼭대기에 닿으면 해가 노랗게 밝아지며 조금 커진다","위로 올리면 선이 다시 지워진다","스크롤 진행률"],
67:["펜으로 그려 나가기","연회색 바탕 위에 짙은 남색 굵은 선으로 그려지는 헤드폰 그림(위쪽 둥근 머리띠 하나와 양쪽의 세로로 긴 둥근 네모 귀 패드 두 개)과, 선 끝을 따라다니는 작은 주황 펜 점이","상자 안을 스크롤할 때","스크롤한 만큼 펜이 지나가듯 머리띠 → 왼쪽 귀 → 오른쪽 귀 순서로 테두리가 그려지고, 다 그려지면 안쪽이 파란색으로 채워지며 아래에 회색 “완료” 글자가 뜬다","선 굵기는 5px. 위로 올리면 거꾸로 지워진다","스크롤 진행률"],
68:["지도에 경로 긋기","연한 하늘색 바다 위에 베이지색 남한 지도(옅은 갈색 테두리, 아래에 작은 제주도)와, 빨간 물방울 모양 도시 핀 5개(가운데 흰 점, 옆에 검정 도시 이름 — 서울·대전·광주·대구·부산)가","상자 안을 스크롤할 때","스크롤한 만큼 서울에서 대전·대구를 지나 부산까지 굵고 둥근 파란 경로선이 그려지고, 선이 도착한 도시 핀이 1.4배로 톡 커졌다 돌아오며 진해진다","경로가 지나지 않는 광주 핀은 흐리게 남는다. 위로 올리면 선이 지워진다","스크롤 진행률, 지나간 도시"],
69:["차트가 자란다","연회색 바탕 아래쪽에 위 모서리가 둥근 흰 카드(“주간 지표” 제목)와, 카드 안의 위가 둥근 파란 세로 막대 6개, 오른쪽 회색 고리 위에 파란 고리가 겹친 도넛 그래프(가운데 굵은 검정 숫자)가","상자 안을 스크롤할 때","스크롤하면 카드가 아래에서 올라오고, 막대가 왼쪽부터 차례로 서로 다른 높이로 자라며 도넛이 0에서 72%까지 시계 방향으로 채워진다","가운데 숫자는 도넛과 함께 올라간다. 위로 올리면 다시 줄어든다","스크롤 진행률"],
70:["연도가 넘어가는 타임라인","연한 베이지 바탕 가운데 아주 크고 굵은 짙은 남색 연도 숫자와, 그 아래 가로로 긴 회색 선 위에 흰 동그라미 점 5개(회색 테두리, 처음·가운데·끝 점 아래에 회색 연도 글씨)가","상자 안을 스크롤할 때","스크롤한 만큼 연도가 1996에서 2015까지 한 해씩 넘어가고(숫자가 살짝 위아래로 밀리며 바뀜), 지나간 점과 선은 주황색으로 채워진다","위로 올리면 연도가 거꾸로 내려간다","지금 연도"],
71:["찌그러지며 튕기는 공","연한 베이지 화면 아래쪽 진한 베이지 바닥 띠와, 바닥 위의 빨간 공 하나(동그란 모양, 오른쪽 아래가 조금 어두움), 공 아래 흐릿한 까만 타원 그림자가","화면을 누를 때","누른 가로 위치의 위쪽에서 공이 떨어져 바닥에 닿을 때마다 납작하게 30% 찌그러졌다가 세로로 늘어나며 튀어 오르고, 튈 때마다 높이가 70%로 줄어든다. 공이 높이 있을수록 그림자는 작고 흐리다","다 튀고 나면 바닥에 멈춘다","공 위치, 속도"],
72:["쏟아져 쌓이는 알갱이","연한 베이지 바탕에 가로로 긴 갈색 나무판(오른쪽이 낮게 기울어 있음)과 그 아래 갈색 세로 기둥 2개, 바닥 갈색 줄, 그리고 모래색(연노랑·황토·갈색이 섞인) 작은 네모 알갱이가","화면을 꾹 누르고 있을 때","누른 곳에서 알갱이가 계속 쏟아져 떨어지고, 판과 바닥에 닿으면 옆으로 미끄러지며 세모난 모래산처럼 쌓인다","판은 8° 기울어져 있어서 알갱이가 아래쪽으로 흘러내린다. 오른쪽 위 흰 동그라미 ↻ 버튼을 누르면 비워진다","쌓인 알갱이 위치"],
73:["부딪혀 무너짐","연한 베이지 화면 아래쪽 진한 베이지 바닥과, 왼쪽의 짙은 남색 대포(동그란 몸통과 긴 포신, 납작한 받침), 오른쪽의 빨간 벽돌 벽(가로로 긴 벽돌을 엇갈려 6줄 쌓음, 벽돌마다 색이 조금씩 다르고 위쪽에 밝은 줄)이","화면을 누를 때","대포가 누른 쪽으로 고개를 돌려 까만 동그란 포탄을 쏘고, 포탄이 닿은 곳에서 60px 안의 벽돌들이 빙글 돌며 튕겨 날아간다. 받쳐 주던 벽돌이 빠지면 위쪽 벽돌도 무너진다","무너진 벽돌은 바닥에 굴러 멈춘다. 오른쪽 위 흰 동그라미 ↻ 버튼으로 벽을 다시 쌓는다","벽돌마다 위치·속도"],
74:["빛 번짐","까만 화면 가운데 2×2로 놓인 모서리가 둥근 짙은 회청색 카드 4장(가운데 흰 글자 빛·Hover·Glow·Card)이","커서를 카드 위로 올릴 때","커서 자리를 중심으로 지름 200px의 하늘색 빛이 카드 안에 은은하게 번지고, 빛이 닿는 부분의 카드 테두리가 가는 하늘색 선으로 밝아진다","커서가 화면을 벗어나면 0.4초 동안 빛이 사라진다","커서 위치"],
75:["네온 선","가운데가 조금 밝은 짙은 남색 화면을 왼쪽에서 오른쪽으로 가로지르는 하늘색 네온 물결선 4개(가운데는 흰 심, 주변은 빛 번짐, 양 끝은 잔잔하고 가운데가 가장 크게 출렁임)가","커서를 위아래로 움직일 때","물결선이 계속 흐르면서, 커서가 위로 갈수록 물결이 높고 빠르게, 아래로 갈수록 낮고 잔잔해진다. 선이 겹치는 곳은 더 밝게 빛난다","커서가 없으면 중간 세기로 흐른다","커서 높이"],
76:["유리 굴절","크림색 바탕에 초록·빨강·노랑·남색 굵은 줄이 비스듬히(\\ 방향) 반복되고 가로로 옅은 회색 선이 깔린 줄무늬 화면과, 그 위에 떠 있는 투명한 동그란 유리 공(지름 120px, 왼쪽 위에 흰 반짝임, 가장자리는 어둡게, 아래 그림자)이","커서를 움직일 때","유리 공이 커서를 부드럽게 따라오고, 공 안에는 뒤 줄무늬가 1.4배 확대되어 보인다. 왼쪽 아래 흰 이름표에 공 안 배율이 적혀 있다","커서가 밖으로 나가면 공은 그 자리에 멈춘다","공 위치"],
77:["크롬 광택","가운데가 조금 밝은 까만 화면에, 왼쪽의 반짝이는 금속 공(위쪽에 흰 하이라이트)과 오른쪽의 아주 굵고 넓은 영문 대문자 “CHROME” 글자(흰색·밝은 회색·짙은 회색이 가로 띠로 섞여 금속처럼 보임)가","커서를 좌우로 움직일 때","커서 위치에 따라 글자와 공 표면의 반사 띠가 위아래로 미끄러지고 공의 하이라이트가 반대쪽으로 움직이며 금속처럼 번쩍인다. 은색 광택","커서가 없으면 반사 띠가 가운데에 머문다","커서 위치"],
78:["잉크 얼룩 번짐","가운데가 밝고 가장자리가 누런 미색 종이 바탕과, 누르는 곳에 떨어지는 까만 잉크(가장자리가 울퉁불퉁한 동그란 얼룩, 주변에 작은 잉크 방울)가","화면을 누를 때","누른 곳에 잉크 방울이 떨어져 1.5초 동안 지름 80px까지 울퉁불퉁하게 번지고, 주변에 작은 방울이 튀어 나간다","여러 번 누르면 얼룩이 겹쳐 진해진다. 오른쪽 위 흰 동그라미 ↻ 버튼으로 종이를 비운다","얼룩 목록"],
79:["연기와 불꽃","별이 작게 반짝이는 까만 밤하늘 아래, 바닥의 둥근 짙은 갈색 언덕 위에 갈색 통나무 장작 세 개(끝은 연한 갈색 나이테)가 엇갈려 놓여 있고, 그 위에서 노랑 → 주황 → 빨강으로 타오르는 모닥불과 주변의 주황빛 번짐이","커서를 불 가까이 가져갈 때","커서가 가까울수록 불길이 커지고 주황색 작은 불똥이 더 많이 튀어 오르며, 위로 옅은 회색 동그란 연기가 퍼지며 피어오른다","커서가 멀어지면 다시 잔잔하게 탄다","커서와 불 사이 거리"],
80:["하늘 색이 바뀌는 하루","위아래로 색이 번지는 하늘과, 아래쪽에 높이가 다른 네모난 자주색 빌딩 실루엣들(작은 네모 창문이 줄지어 있음), 연노랑 동그란 해(주변에 옅은 빛)가","상자 안을 스크롤할 때","스크롤한 만큼 해가 왼쪽에서 오른쪽으로 무지개처럼 하늘을 가로질러 지고, 하늘색이 아침(주황) → 낮(파랑) → 노을(분홍) → 밤(남색)으로 바뀐다. 해는 질수록 주황빛이 되고, 밤이 되면 건물이 짙은 남색으로 어두워지며 창문에 노란 불이 하나씩 켜지고 초승달과 흰 별이 뜬다","위로 올리면 시간이 거꾸로 간다","하루 시간(스크롤 진행률)"],
81:["무한 줌","베이지 벽과 갈색 나무 바닥의 미술관 — 위에서 비추는 연노랑 조명, 왼쪽의 빨간 그림(살구색 동그라미)과 오른쪽의 주황·남색·하늘색 네모 그림, 아래 짙은 회색 벤치, 가운데 금색 액자 — 그리고 그 금색 액자 안에 다시 똑같은 미술관이 들어 있는 그림이","상자 안을 스크롤할 때","스크롤할수록 가운데 금색 액자 속으로 확대해 들어가서, 액자 안의 미술관이 다시 화면 가득 펼쳐진다. 모두 5단계","왼쪽 위 까만 이름표에 몇 번째 단계인지(1/5) 노란 글씨로 표시되고, 오른쪽에 금색 점으로 단계가 보인다. 위로 올리면 다시 빠져나온다","확대 단계"],
82:["빛줄기 터널 비행","가운데가 조금 밝은 짙은 남색 우주에 흩어진 작은 흰 별 500개가 (가까운 별일수록 크고 밝음)","화면을 꾹 누르고 있을 때","누르는 동안 점점 빨라져 최고 14배 속도까지 화면 가운데에서 바깥쪽으로 날아가고, 별이 가늘고 길게 늘어난 흰 빛줄기가 된다","손을 떼면 천천히 느려져 다시 작은 점으로 돌아온다","지금 속도"],
83:["물체 회전 전시","가운데가 밝은 크림색 바탕 위에, 위에서 살짝 내려다본 검정 원통형 스피커 하나(가로 줄무늬 그릴, 앞면에 세로로 빛나는 주황색 불빛 띠, 윗면은 조금 밝은 회색 원)와 바닥의 흐릿한 타원 그림자가","좌우로 끌 때","끄는 만큼 스피커가 제자리에서 돌고(빛을 받는 면은 밝게, 뒤쪽 면은 어둡게 보임), 손을 놓으면 던진 속도로 계속 돌다가 서서히 멈춘다. 가만히 두면 1초에 10°씩 천천히 돈다","위아래로는 돌지 않는다","회전 각도, 회전 속도"],
84:["분해도","연한 베이지 바탕 가운데 위아래가 둥근 네모 기기 하나가 — 위부터 짙은 회색 둥근 뚜껑, 검정·노랑 칩이 박힌 초록 회로판, 회색 사각 셀 4개가 든 배터리, 짙은 회색 둥근 바닥 — 한 덩어리로 쌓여 있다","상자 안을 아래로 스크롤할 때","스크롤할수록 부품들이 위아래로 60px씩 벌어지며 분해되고, 부품마다 오른쪽에 가는 회색 선과 이름표(위 뚜껑·회로판·배터리·아래 바닥)가 나타난다. 아래에 분해된 정도(%)가 표시된다","위로 올리면 다시 합쳐진다","분해 정도"],
85:["스크롤로 걷는 실내","연한 베이지 바탕에 짙은 회색 가는 선으로만 그린 원근 복도(10칸, 천장 조명 네모, 양옆 벽의 문, 맨 끝 계단)와, 오른쪽 위에 살짝 기울어진 흰 폴라로이드 사진 카드(위는 장소 색 그림, 아래 주황 번호와 장소 이름)가","상자 안을 스크롤할 때","스크롤한 만큼 복도 안으로 걸어 들어가는 것처럼 벽과 문이 다가와 지나간다. 구간이 바뀌면 폴라로이드가 살짝 흔들리며 “01 복도(회색) → 02 갤러리(살구색) → 03 작업실(민트)”로 바뀐다","위로 올리면 뒤로 걷는다","걸은 거리"],
86:["유리구슬 속 장면","가운데가 밝은 짙은 남색 배경 위에 둥근 투명 유리구슬(흰 테두리와 반짝임)과 아래 갈색 사다리꼴 받침, 구슬 안의 흰 눈 언덕, 빨간 벽에 흰 지붕·노란 창문의 작은 집, 초록 세모 나무 세 그루가","구슬을 잡고 흔들 때","흔든 세기만큼 구슬 안의 하얀 눈 220개가 휘날리고, 손을 놓으면 구슬이 통통 튀듯 제자리로 돌아오고 눈이 천천히 가라앉는다","흔들지 않으면 눈은 바닥에 쌓여 있다","눈송이 위치, 흔든 세기"],
87:["글자 속 사진","연한 베이지 바탕 가운데에 세 줄로 쌓인 아주 굵고 넓은 영문 대문자 “OCEAN / DRIFT / LIGHT”와, 그 글자 안에만 비쳐 보이는 노을 사진(위는 보라, 가운데는 분홍·주황·연노랑, 노란 해, 아래는 다시 보라)이","상자 안을 스크롤할 때","스크롤하면 글자 속 사진이 아래에서 위로 천천히 흘러가고, 글자 간격이 살짝 좁아지며 단어들이 가까워지고 조금 커진다","글자 밖에는 사진이 보이지 않는다","스크롤 진행률"],
88:["색 판이 덮는 전환","화면 가득 채운 색 장면(남색 → 주황 → 초록 → 보라 순서)과 가운데 큰 흰 글씨 “장면 1”, 그 아래 작은 안내 글, 오른쪽 아래 흰 알약 모양 “다음 →” 버튼이","다음 버튼을 누를 때","다음 장면 색과 그보다 밝거나 어두운 색의 색 판 3장이 0.8초 동안 왼쪽에서 오른쪽으로 차례로 화면을 덮고 지나가면서 다음 장면으로 바뀐다","4장면 다음에는 1장면으로 돌아간다. 전환 중에는 버튼이 눌리지 않는다","지금 장면"],
89:["페이지 넘김","회베이지 바탕 위에 펼쳐진 여행 책 — 왼쪽 미색 페이지(주황 작은 영문 “TRAVEL”, 검정 제목 “바다로 가는 길”, 노을 사진)와 오른쪽 페이지(하늘색 사진, 연노랑 해) — 가 가운데 접힌 선을 두고 놓여 있다","오른쪽 페이지를 잡고 왼쪽으로 끌 때","끄는 만큼 오른쪽 페이지가 가운데 접힌 선을 축으로 넘어가고, 넘어가는 면에 까만 그림자가 진다. 절반 넘게 끌고 놓으면 0.6초 동안 끝까지 넘어가며 다음 장(첫 바다 → 등대 → 다시, 바다)이 보인다","절반이 안 되면 다시 제자리로 돌아간다. 마지막 장에서는 까만 알약 “처음으로” 버튼이 나온다","지금 쪽"],
90:["박자 컷","화면 가득 채운 색 배경(처음엔 주황빨강)과 크림색 큰 동그라미, 왼쪽 아래 아주 굵고 큰 검정 한글 “울림”, 아래 가운데 흰 알약 “음악 켜기” 버튼이 있는 포스터 화면이","“음악 켜기”를 누를 때","1분에 120번 울리는 북소리에 맞춰 박자마다 글자(울림·박자·컷·리듬)·배경색(주황빨강·남색·노랑·초록)·동그라미 위치와 크기가 한 번에 뚝 바뀐다 (컷 전환)","다시 누르면 음악과 전환이 멈춘다. 소리를 낼 수 없으면 소리 없이 박자만 바뀐다","박자 수"],
91:["화면 속 화면","크림색 “바깥” 화면(왼쪽 위 검정 제목, 오른쪽 위 회색 줄 두 개, 오른쪽 아래 코랄 큰 동그라미, 왼쪽 아래 청록 동그라미와 분홍 세로 막대) 가운데에 까만 테두리의 작은 기기 화면(남색 “안쪽” 화면)이 있고, 그 안에 또 작은 크림색 화면(노란 카드)이 들어 있다","작은 화면을 누를 때","작은 화면이 0.8초 동안 부드럽게 커져 화면 가득 채워지고, 남색 “안쪽” 화면이 새 화면이 된다. 한 번 더 누르면 노란 카드가 있는 “가장 안쪽” 화면으로 들어간다","가장 안쪽에서 누르면 처음 바깥 화면으로 빠져나온다","지금 깊이"],
92:["색종이 터짐","연회색 바탕 가운데 흰 글씨의 둥근 알약 모양 파란 “완료” 버튼이 (아래에 파란 그림자)","버튼을 누를 때","버튼이 살짝 눌렸다 튀어 오르며 “✓ 완료!”로 바뀌고, 버튼에서 빨강·주황·노랑·초록·하늘·파랑·보라·분홍 작은 네모 색종이 120장이 위로 터져 나와 빙글빙글 뒤집히며 떨어진다","색종이가 다 떨어지고 1.5초 뒤 버튼이 원래대로 돌아온다","색종이 위치"],

  m:{ids:range(52,97),secs:[["K","글자가 움직인다",52,59,"글자 자체가 움직임이 된다"],["L","형태가 바뀐다",60,65,"하나의 모양이 다른 모양이 된다"],["M","그려지고 자란다",66,70,"선이 그려지고 숫자가 자란다"],["N","무게가 있다",71,73,"떨어지고 쌓이고 무너진다"],["O","빛과 재질",74,80,"빛, 유리, 금속, 잉크, 불"],["P","공간을 움직인다",81,86,"화면 안으로 들어가고 돌린다"],["Q","화면이 바뀐다",87,91,"장면과 장면 사이"],["R","터지고 보상한다",92,93,"끝냈을 때의 기쁨"],["S","질감과 스타일",94,97,"종이, 픽셀, 무늬, 소리"]]}};
const IDS=[...PARTS.i.ids,...PARTS.m.ids],INPAGE=[6,9,12];
const FIELDS=[["object","[오브젝트]","무엇이"],["trigger","[트리거]","언제"],["response","[반응]","어떻게 — 시간·크기·움직임"],["condition","[조건]","예외 (없으면 “없음”)"],["variable","[변수]","기억할 값 (없으면 “없음”)"]];
const spec={}; for(const k in SEED) spec[+k]={...SEED[k]};
for(const k in MSEED){ if(!spec[k]){ const [name,object,trigger,response,condition,variable]=MSEED[k]; spec[k]={name,object,trigger,response,condition,variable} } }
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const DEF={},P={},LSK=n=>"cat46-tune-"+n;
function valid(q,v){ if(q.t==="r"){ v=Number(v); if(!isFinite(v)) return; v=Math.min(q.max,Math.max(q.min,v)); v=Math.round((v-q.min)/q.step)*q.step+q.min; return +v.toFixed(4) } return q.o.includes(v)?v:undefined }
IDS.forEach(n=>{ DEF[n]=Object.fromEntries(ITEMS[n].p.map(q=>[q.k,q.v])); P[n]={...DEF[n]};
  try{ const s=JSON.parse(localStorage.getItem(LSK(n))||"{}"); ITEMS[n].p.forEach(q=>{ if(q.k in s){ const v=valid(q,s[q.k]); if(v!==undefined) P[n][q.k]=v } }) }catch(e){} });
const tuned=n=>ITEMS[n].p.some(q=>P[n][q.k]!==DEF[n][q.k]);
const saveP=n=>{ try{ const d={}; ITEMS[n].p.forEach(q=>{ if(P[n][q.k]!==DEF[n][q.k]) d[q.k]=P[n][q.k] }); Object.keys(d).length?localStorage.setItem(LSK(n),JSON.stringify(d)):localStorage.removeItem(LSK(n)) }catch(e){} };
const fmtV=q=>v=>q.t==="r"?(q.u==="초"?fs(v)+"초":(Number.isInteger(q.step)?v:fs(v))+(q.u&&q.u!=="초"?q.u:"")):v;
function linked(n,text){ let h=esc(text||"");
  ITEMS[n].tx.forEach(([f,fn])=>{ const rep=fn(P[n]);
    if(typeof f==="string"){ const ef=esc(f); if(rep!==f) h=h.split(ef).join(`<mark>${esc(rep)}</mark>`) }
    else h=h.replace(f,m=>m===rep?m:`<mark>${esc(rep)}</mark>`) });
  return h }

/* ───────── 카드 ───────── */
const grow=ta=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px" };
const rafs={},mounted={};
function mount(n){ const st=document.getElementById("stage-"+pad(n)),it=ITEMS[n]; st.innerHTML=""; st.classList.toggle("free",!!it.free);
  const w=document.createElement("div"); w.className="demo"+(it.free?" free":"")+(it.flush?" flush":""); st.appendChild(w);
  try{ it.run(w,P[n]) }catch(e){ w.textContent="이 조합에서는 화면을 만들지 못했어요. ‘원래대로’를 눌러 주세요."; console.error(e) } }
const remount=n=>{ if(!mounted[n]) return; cancelAnimationFrame(rafs[n]); rafs[n]=requestAnimationFrame(()=>mount(n)) };
const mio=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; const n=+e.target.dataset.n; mio.unobserve(e.target); if(!mounted[n]){ mounted[n]=1; mount(n) } }),{rootMargin:"500px 0px"});

function card(n){ const id=pad(n),it=ITEMS[n],c=document.createElement("article");
  c.className="card"; c.id="i"+id; c.dataset.n=n;
  c.innerHTML=`<div class="card-head"><span class="num">${id}</span><input class="name" id="name-${id}" aria-label="${id}번 이름" placeholder="인터랙션 이름"><span class="hint">${HINTS[n]||""}</span><span class="pillst" id="pill-${id}"></span></div>
  <div class="card-body">
    <div class="spec" id="spec-${id}">
      ${FIELDS.map(([k,l,ph])=>`<div class="row"><label for="${k}-${id}">${l}</label><div><textarea id="${k}-${id}" data-k="${k}" rows="1" placeholder="${ph}"></textarea><div class="view" id="v-${k}-${id}"></div></div></div>`).join("")}
      <div class="spec-foot">
        <div class="foot-row"><small id="note-${id}"></small><button class="sbtn copy">명세 복사</button></div>
        <div class="ai" hidden><input id="ai-${id}" placeholder="명세를 글로 고쳐 보세요 — 예) 0.5초로, 파란색으로" aria-label="${id}번 명세 고치기"><button class="sbtn ai-go">반영</button></div>
        <p class="ai-msg" id="aim-${id}" hidden></p>
      </div>
    </div>
    <div class="right"><div class="stage" id="stage-${id}"></div>
      <div class="knobs" id="knobs-${id}"><div class="knobs-h"><span>조절값 · 내 화면에만 적용</span><button class="sbtn reset">원래대로</button></div>
        ${it.p.map(q=>{ const kid=`kn-${id}-${q.k}`;
          const ctl=q.t==="r"?`<input type="range" id="${kid}" data-k="${q.k}" min="${q.min}" max="${q.max}" step="${q.step}" value="${P[n][q.k]}">`
            :`<select id="${kid}" data-k="${q.k}">${q.o.map(o=>`<option${o===P[n][q.k]?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
          return `<div class="knob" data-k="${q.k}"><label for="${kid}">${q.l}</label><output id="o-${kid}">${esc(fmtV(q)(P[n][q.k]))}</output>${ctl}</div>` }).join("")}
      </div></div>
  </div>`;
  return c }
["i","m"].forEach(pk=>{ const host=document.getElementById("part-"+pk);
  PARTS[pk].secs.forEach(([L,t,a,b,sub])=>{ host.insertAdjacentHTML("beforeend",`<div class="sec-h"><b>${L} ${t}</b><small>${sub}</small></div>`);
    for(let n=a;n<=b;n++){ const c=card(n); host.appendChild(c); mio.observe(c.querySelector(".stage")) } }) });
document.querySelectorAll(".stage").forEach(s=>s.dataset.n=s.id.slice(6)*1);

function paint(n){ const id=pad(n),s=spec[n]||{},sp=document.getElementById("spec-"+id),t=tuned(n);
  const nm=document.getElementById("name-"+id); if(document.activeElement!==nm) nm.value=s.name||NAMES[n];
  FIELDS.forEach(([k])=>{ const ta=document.getElementById(`${k}-${id}`); if(document.activeElement!==ta) ta.value=s[k]||""; grow(ta);
    document.getElementById(`v-${k}-${id}`).innerHTML=linked(n,s[k])||'<span style="color:var(--faint)">—</span>' });
  sp.classList.toggle("tuned",t);
  const pill=document.getElementById("pill-"+id); pill.className="pillst"+(t?" tuned":""); pill.textContent=t?"조절됨":"기본";
  document.getElementById("note-"+id).textContent=t?"노란 부분이 조절값에 맞춰 바뀐 내용이에요.":(readOnly?"보기 전용 — 오른쪽 조절값은 내 화면에만 적용돼요.":"회색 글씨를 지우고 내 내용으로 바꾸세요.");
  const kb=document.getElementById("knobs-"+id); kb.querySelector(".reset").disabled=!t;
  ITEMS[n].p.forEach(q=>kb.querySelector(`.knob[data-k="${q.k}"]`).classList.toggle("changed",P[n][q.k]!==DEF[n][q.k])) }
function setP(n,k,v,ui=true){ const q=ITEMS[n].p.find(x=>x.k===k),id=pad(n); if(!q) return; v=valid(q,v); if(v===undefined) return; P[n][k]=v;
  const el=document.getElementById(`kn-${id}-${k}`); if(ui) el.value=v; document.getElementById(`o-kn-${id}-${k}`).textContent=fmtV(q)(v) }
function after(n){ saveP(n); paint(n); counts(); remount(n); if(n===6) cursorStyle() }

const mainEl=document.querySelector("main");
mainEl.addEventListener("input",e=>{ const c=e.target.closest(".card"); if(!c) return; const n=+c.dataset.n;
  if(e.target.closest(".knobs")){ setP(n,e.target.dataset.k,e.target.type==="range"?+e.target.value:e.target.value,false); after(n); return }
  if(e.target.closest(".stage")||e.target.closest(".ai")||readOnly) return;
  spec[n]=spec[n]||{};
  if(e.target.classList.contains("name")) spec[n].name=e.target.value;
  else if(e.target.dataset.k){ spec[n][e.target.dataset.k]=e.target.value; grow(e.target) }
  paint(n); queueSave(n) });
mainEl.addEventListener("click",async e=>{ const c=e.target.closest(".card"); if(!c) return; const n=+c.dataset.n,id=pad(n);
  if(e.target.closest(".reset")){ ITEMS[n].p.forEach(q=>setP(n,q.k,DEF[n][q.k])); after(n); return }
  const cp=e.target.closest(".copy");
  if(cp){ const s=spec[n]||{},t=`#${id} ${s.name||NAMES[n]}\n`+FIELDS.map(([k,l])=>`${l} ${document.getElementById(`v-${k}-${id}`).textContent.trim()}`).join("\n");
    try{ await navigator.clipboard.writeText(t); cp.textContent="복사됨" }catch(_){ cp.textContent="복사 실패" } setTimeout(()=>cp.textContent="명세 복사",1400); return }
  if(e.target.closest(".ai-go")) askAI(n) });
mainEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.closest(".ai")){ e.preventDefault(); askAI(+e.target.closest(".card").dataset.n) } });

/* ───────── 파트 전환 · 번호 칩 · 필터 ───────── */
let part="i",filter="all";
const chips=document.getElementById("chips");
function showPart(pk){ part=pk==="m"?"m":"i";
  document.querySelectorAll(".parts button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.part===part));
  document.getElementById("part-i").hidden=part!=="i"; document.getElementById("part-m").hidden=part!=="m";
  chips.innerHTML=PARTS[part].ids.map(n=>`<button data-n="${n}" class="${INPAGE.includes(n)?"inpage":""}" title="${esc(NAMES[n])}">${pad(n)}</button>`).join(""); counts() }
document.querySelectorAll(".parts button").forEach(b=>b.addEventListener("click",()=>{ const pk=b.dataset.part; if(pk===part) return; try{ history.replaceState(null,"",pk==="m"?"#motion":"#interaction") }catch(e){} showPart(pk) }));
chips.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; const c=document.getElementById("i"+pad(+b.dataset.n)); if(c){ c.hidden=false; c.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"}) } });
addEventListener("hashchange",()=>showPart(location.hash==="#motion"?"m":"i"));
function counts(){ const ids=PARTS[part].ids; let t=0; ids.forEach(n=>{ if(tuned(n)) t++ });
  document.getElementById("c-all").textContent=ids.length; document.getElementById("c-tuned").textContent=t; document.getElementById("c-base").textContent=ids.length-t;
  ids.forEach(n=>{ const show=filter==="all"||(filter==="tuned"&&tuned(n))||(filter==="base"&&!tuned(n)); document.getElementById("i"+pad(n)).hidden=!show }) }
document.querySelectorAll(".ftabs button").forEach(b=>b.addEventListener("click",()=>{ filter=b.dataset.f; document.querySelectorAll(".ftabs button").forEach(x=>x.setAttribute("aria-pressed",x===b)); counts() }));

/* ───────── 명세 저장 (db) ───────── */
let db=null,readOnly=false; const syncEl=document.getElementById("sync"),timers={};
function setRO(ro){ readOnly=ro; document.querySelectorAll(".spec textarea,.name").forEach(x=>x.readOnly=ro); IDS.forEach(paint) }
function queueSave(n){ clearTimeout(timers[n]); timers[n]=setTimeout(async()=>{ if(!db||readOnly) return;
  syncEl.textContent="저장 중"; syncEl.classList.remove("ok");
  try{ await db.doc("specs/"+pad(n)).set({...spec[n],updatedAt:new Date().toISOString()}); syncEl.textContent="저장됨"; syncEl.classList.add("ok") }
  catch(e){ if(e.code==="invalid_argument"){ setRO(true); syncEl.textContent="보기 전용" } else syncEl.textContent="저장 실패 — 다시 입력하면 재시도" } },700) }
IDS.forEach(paint); showPart(location.hash==="#motion"?"m":"i");
(async()=>{
  const cl=window.claude;
  const [dbx,ux,sx]=await Promise.all(["db","user","sample"].map(k=>cl?.use?cl.use(k).catch(()=>null):Promise.resolve(null)));
  db=dbx;
  if(sx){ document.querySelectorAll(".ai").forEach(a=>a.hidden=false); window.__sample=sx }
  if(ux){ try{ const w=await ux.can("data.write"); if(w===false) setRO(true) }catch(e){} }
  if(!db){ setRO(true); syncEl.textContent="저장된 명세 사본을 보여주는 중"; return }
  const lt=setTimeout(()=>{ syncEl.textContent="저장소에 아직 연결되지 않음 — 사본 표시 중" },10000);
  db.collection("specs").onSnapshot(snap=>{ snap.docs.forEach(d=>{ const n=parseInt(d.id,10); if(ITEMS[n]){ spec[n]={...d.data()}; paint(n) } });
    if(!snap.metadata.fromCache){ clearTimeout(lt); syncEl.textContent=readOnly?"보기 전용 · 최신 명세":"동기화됨"; syncEl.classList.add("ok") } },
    ()=>{ clearTimeout(lt); syncEl.textContent="저장소 연결 끊김 — 사본 표시 중"; db=null; setRO(true) });
})();
/* ───────── 명세를 글로 고치면 → AI가 조절값으로 옮김 ───────── */
async function askAI(n){ const id=pad(n),inp=document.getElementById("ai-"+id),btn=inp.nextElementSibling,msg=document.getElementById("aim-"+id),s=window.__sample;
  const ask=inp.value.trim(); if(!s||!ask||btn.disabled) return;
  msg.hidden=false; msg.textContent="명세를 읽는 중…"; btn.disabled=true;
  const it=ITEMS[n],sp=spec[n]||{};
  const knobs=it.p.map(q=>q.t==="r"?{키:q.k,설명:q.l,종류:"숫자",범위:[q.min,q.max],단위:q.u||"",현재값:P[n][q.k]}:{키:q.k,설명:q.l,종류:"선택",선택지:q.o,현재값:P[n][q.k]});
  const prompt=`너는 인터랙션 명세를 조절값으로 옮기는 도우미야.
아래는 #${id} ${sp.name||NAMES[n]}의 명세와, 이 화면에서 바꿀 수 있는 조절값 목록이야.

[명세]
${FIELDS.map(([k,l])=>`${l} ${sp[k]||""}`).join("\n")}

[조절값 목록]
${JSON.stringify(knobs,null,1)}

[사용자가 고친 내용]
${ask}

규칙:
- 사용자가 바꾸려는 것만 조절값으로 옮겨. 언급하지 않은 값은 넣지 마.
- 숫자는 범위 안의 숫자로, 선택은 선택지 중 하나를 글자 그대로 써.
- "0.2배 커진다"처럼 '커지는 정도'를 말하면 배율은 1+그 값이야.
- 조절값으로 표현할 수 없는 요청은 set에 넣지 말고 note에 짧게 적어.
- 답은 JSON 하나만: {"set":{"키":값},"note":"한국어 한 문장"}`;
  try{ const r=await s.json(prompt,{modelTier:"quick"}); const set=r&&typeof r.set==="object"?r.set:{}; let k=0;
    for(const key in set){ const q=it.p.find(x=>x.k===key); if(!q) continue; const v=valid(q,set[key]); if(v===undefined) continue; setP(n,key,v); k++ }
    if(k) after(n);
    msg.textContent=(k?`조절값 ${k}개를 바꿨어요. `:"바꿀 수 있는 조절값을 찾지 못했어요. ")+(r&&r.note?r.note:"") }
  catch(e){ const c=e&&e.code;
    if(c==="not_granted"){ document.querySelectorAll(".ai").forEach(a=>a.hidden=true); msg.textContent="이 화면에서는 글 반영을 쓸 수 없어요. 오른쪽 조절값을 직접 움직여 주세요." }
    else if(c==="rate_limited") msg.textContent="지금은 요청이 많아요. 잠시 뒤에 다시 눌러 주세요.";
    else msg.textContent="글을 조절값으로 옮기지 못했어요. 더 짧게, 예) ‘0.5초로’처럼 적어 보세요." }
  finally{ btn.disabled=false } }

/* ───────── 전역: 진행 막대 · 숨는 상단 바 · 06 커서 ───────── */
const prog=document.querySelector("#progress i"),topbar=document.getElementById("topbar"); let lastY=scrollY,tick=false;
addEventListener("scroll",()=>{ if(tick) return; tick=true; requestAnimationFrame(()=>{ tick=false;
  const h=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${h>0?scrollY/h:0})`;
  const dy=scrollY-lastY; if(scrollY<80) topbar.classList.remove("hide"); else if(dy>6) topbar.classList.add("hide"); else if(dy<-6) topbar.classList.remove("hide");
  if(Math.abs(dy)>6) lastY=scrollY }) },{passive:true});
const cur=document.getElementById("cur"),dot=document.getElementById("dot"),html=document.documentElement;
function cursorStyle(){ const p=P[6]; cur.style.width=cur.style.height=p.z+"px"; cur.style.margin=`-${p.z/2}px 0 0 -${p.z/2}px`;
  html.style.setProperty("--cc",p.c==="검정"?"var(--ink)":COL[p.c]) }
cursorStyle();
{ let tx=-100,ty=-100,x=-100,y=-100,last=performance.now(),big=false;
  addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse"){ html.classList.remove("cc"); cur.classList.remove("on"); dot.classList.remove("on"); return }
    if(!html.classList.contains("cc")){ x=e.clientX; y=e.clientY }
    tx=e.clientX; ty=e.clientY; html.classList.add("cc"); cur.classList.add("on"); dot.classList.add("on");
    dot.style.transform=`translate(${tx}px,${ty}px)`;
    big=!!e.target.closest(".stage button,.stage img,.stage [role=img],.stage [data-img],.car-card,.knob15,.hz");
    cur.firstElementChild.style.transform=big?`scale(${P[6].g})`:"" },{passive:true});
  document.addEventListener("mouseout",e=>{ if(!e.relatedTarget){ cur.classList.remove("on"); dot.classList.remove("on") } });
  (function f(now){ now=now||last; const dt=Math.min(.05,(now-last)/1000); last=now; const k=RM?1:1-Math.exp(-dt/Math.max(.01,P[6].lag/3));
    x+=(tx-x)*k; y+=(ty-y)*k; cur.style.transform=`translate(${x}px,${y}px)`; requestAnimationFrame(f) })();
}
</script>
</body></html>
